<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Samurai Anime Login</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Cyberpunk Fonts: Orbitron & Rajdhani -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            orbitron: ['Orbitron', 'sans-serif'],
            rajdhani: ['Rajdhani', 'sans-serif'],
          },
          colors: {
            cyberCyan: '#00f0ff',
            cyberPink: '#ff007f',
            cyberPurple: '#7000ff',
            cyberDark: '#080b14',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #050811;
      color: #f8fafc;
    }

    /* Neon Glow Utilities */
    .glow-cyan {
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.45), inset 0 0 10px rgba(0, 240, 255, 0.2);
    }
    .glow-pink {
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.45), inset 0 0 10px rgba(255, 0, 127, 0.2);
    }
    .text-glow-cyan {
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.8), 0 0 24px rgba(0, 240, 255, 0.4);
    }
    .text-glow-pink {
      text-shadow: 0 0 12px rgba(255, 0, 127, 0.8), 0 0 24px rgba(255, 0, 127, 0.4);
    }

    /* Custom Cyber Clip Paths */
    .cyber-cut {
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    }
    .cyber-btn-cut {
      clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    }

    /* Keyframe Animations */
    @keyframes floatIdle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }

    @keyframes hairFlow {
      0%, 100% { transform: rotate(0deg) skewX(0deg); }
      50% { transform: rotate(3deg) skewX(2deg); }
    }

    @keyframes auraPulse {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4)) drop-shadow(0 0 35px rgba(255, 0, 127, 0.2)); }
      50% { filter: drop-shadow(0 0 30px rgba(0, 240, 255, 0.8)) drop-shadow(0 0 50px rgba(255, 0, 127, 0.6)); }
    }

    @keyframes glitchScan {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    .animate-float { animation: floatIdle 4.5s ease-in-out infinite; }
    .animate-hair { animation: hairFlow 3.8s ease-in-out infinite; transform-origin: top center; }
    .animate-aura { animation: auraPulse 2.8s ease-in-out infinite; }

    /* Interactive SVG Transitions */
    .head-group {
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: 140px 150px;
    }

    .eye-pupil {
      transition: transform 0.12s ease-out;
    }

    /* Cyber Visor Dropdown Logic */
    .cyber-visor {
      transition: transform 0.45s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.3s ease;
      transform-origin: 140px 80px;
      transform: translateY(-85px);
      opacity: 0;
    }

    .visor-locked {
      transform: translateY(0px) !important;
      opacity: 1 !important;
    }

    .visor-peek {
      transform: translateY(-38px) !important;
      opacity: 0.95 !important;
    }

    /* Glassmorphic Panel */
    .cyber-glass {
      background: rgba(10, 15, 30, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 240, 255, 0.2);
    }

    /* Input Focus Glowing Effects */
    .cyber-input:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.4);
    }
  </style>
</head>
<body class="min-h-screen w-full relative overflow-x-hidden flex items-center justify-center p-4">

  <!-- Interactive Background Canvas (Matrix & Cyber Particles) -->
  <canvas id="cyberCanvas" class="absolute inset-0 pointer-events-none z-0 w-full h-full"></canvas>

  <!-- Ambient Glow Orbs -->
  <div class="absolute top-1/4 left-10 w-72 h-72 bg-cyberCyan/15 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-10 w-80 h-80 bg-cyberPink/15 rounded-full blur-[120px] pointer-events-none"></div>

  <!-- MAIN GLASS CONTAINER -->
  <main class="relative z-10 w-full max-w-4xl mx-auto my-auto">
    <div class="cyber-glass cyber-cut rounded-3xl p-6 md:p-10 relative overflow-hidden">
      
      <!-- Top Decorative Scanline Banner -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-cyberCyan via-cyberPink to-cyberPurple shadow-[0_0_15px_#00f0ff]"></div>

      <!-- Header Title -->
      <div class="text-center mb-8 relative">
        <span class="inline-flex items-center gap-2 px-3 py-1 rounded-sm bg-cyberCyan/10 text-cyberCyan font-orbitron text-xs tracking-widest uppercase border border-cyberCyan/30">
          <i class="fa-solid fa-microchip text-cyberPink animate-pulse"></i> SYSTEM AUTHENTICATION v3.0
        </span>
        <h1 class="text-3xl md:text-5xl font-extrabold font-orbitron tracking-wider mt-2 text-white text-glow-cyan">
          NEON<span class="text-cyberPink text-glow-pink">SAMURAI</span>
        </h1>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
        
        <!-- LEFT COLUMN: Cyberpunk Anime Girl Character SVG -->
        <div class="lg:col-span-5 flex flex-col items-center justify-center relative min-h-[350px]">
          
          <div class="relative w-72 h-96 flex items-center justify-center animate-float">
            
            <svg id="cyberAnimeSvg" viewBox="0 0 280 340" class="w-full h-full drop-shadow-2xl overflow-visible animate-aura">
              <defs>
                <!-- Skin Gradient -->
                <linearGradient id="cyberSkin" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fff1f2" />
                  <stop offset="100%" stop-color="#fecdd3" />
                </linearGradient>

                <!-- Neon Magenta Hair Gradient -->
                <linearGradient id="hairPink" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ff007f" />
                  <stop offset="100%" stop-color="#9d4edd" />
                </linearGradient>

                <!-- Neon Cyan Highlights -->
                <linearGradient id="cyberCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#00f0ff" />
                  <stop offset="100%" stop-color="#7000ff" />
                </linearGradient>

                <!-- Visor Shield Glass Gradient -->
                <linearGradient id="visorGlass" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#080b14" stop-opacity="0.95" />
                  <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8" />
                </linearGradient>
              </defs>

              <!-- Cyber Twin-Tails Hair Backing -->
              <g class="animate-hair">
                <path d="M 50 120 C 10 160, 0 250, 20 290 C 40 250, 55 190, 70 140 Z" fill="url(#hairPink)" />
                <path d="M 230 120 C 270 160, 280 250, 260 290 C 240 250, 225 190, 210 140 Z" fill="url(#hairPink)" />
              </g>

              <!-- Cyberpunk Jacket & Collar -->
              <g id="jacket-group">
                <!-- High Tech Collar -->
                <path d="M 80 210 L 140 250 L 200 210 L 220 310 L 60 310 Z" fill="#0f172a" stroke="#00f0ff" stroke-width="2" />
                <!-- Neon Glowing Collar Lines -->
                <path d="M 95 215 L 140 242 L 185 215" stroke="#ff007f" stroke-width="3" fill="none" class="animate-pulse" />
                <!-- Cyber Armor Shoulder Pads -->
                <path d="M 45 250 Q 70 230 90 245 L 80 310 L 40 310 Z" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5" />
                <path d="M 235 250 Q 210 230 190 245 L 200 310 L 240 310 Z" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5" />
              </g>

              <!-- Neck with Cyber Implants -->
              <g id="neck-group">
                <rect x="124" y="165" width="32" height="45" rx="8" fill="url(#cyberSkin)" />
                <!-- Cyber Neck Lines -->
                <path d="M 130 175 L 150 175 M 130 185 L 150 185" stroke="#00f0ff" stroke-width="2" opacity="0.8" />
              </g>

              <!-- Dynamic Head Group (Rotates & Tilts) -->
              <g id="headGroup" class="head-group">
                
                <!-- Head Base -->
                <path d="M 85 80 C 85 30, 195 30, 195 80 C 195 125, 175 170, 140 170 C 105 170, 85 125, 85 80 Z" fill="url(#cyberSkin)" />

                <!-- Cheek Cyberware Implants -->
                <path d="M 95 125 L 110 135 M 93 132 L 105 140" stroke="#ff007f" stroke-width="2" stroke-linecap="round" />
                <path d="M 185 125 L 170 135 M 187 132 L 175 140" stroke="#ff007f" stroke-width="2" stroke-linecap="round" />

                <!-- Cyber Eyes -->
                <g id="eyesGroup">
                  <!-- Left Eye -->
                  <path d="M 100 100 Q 115 92 128 102" stroke="#0f172a" stroke-width="3.5" fill="none" stroke-linecap="round" />
                  <ellipse cx="114" cy="110" rx="10" ry="13" fill="#0f172a" />
                  <ellipse cx="114" cy="110" rx="8" ry="10" fill="url(#cyberCyanGrad)" />
                  <!-- Left Pupil Glow -->
                  <circle id="pupilLeft" class="eye-pupil" cx="112" cy="108" r="3.5" fill="#ffffff" />
                  <circle cx="116" cy="113" r="2" fill="#00f0ff" />

                  <!-- Right Eye -->
                  <path d="M 152 102 Q 165 92 180 100" stroke="#0f172a" stroke-width="3.5" fill="none" stroke-linecap="round" />
                  <ellipse cx="166" cy="110" rx="10" ry="13" fill="#0f172a" />
                  <ellipse cx="166" cy="110" rx="8" ry="10" fill="url(#cyberCyanGrad)" />
                  <!-- Right Pupil Glow -->
                  <circle id="pupilRight" class="eye-pupil" cx="164" cy="108" r="3.5" fill="#ffffff" />
                  <circle cx="168" cy="113" r="2" fill="#00f0ff" />

                  <!-- Eyebrows -->
                  <path d="M 98 88 Q 114 82 126 90" stroke="#ff007f" stroke-width="3" fill="none" stroke-linecap="round" />
                  <path d="M 154 90 Q 166 82 182 88" stroke="#ff007f" stroke-width="3" fill="none" stroke-linecap="round" />
                </g>

                <!-- Nose & Mouth -->
                <path d="M 140 122 L 138 128 L 142 128" stroke="#f43f5e" stroke-width="1.5" fill="none" />
                <path id="cyberMouth" d="M 130 142 Q 140 148 150 142" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" fill="none" />

                <!-- Front Anime Bangs & Hair -->
                <g id="bangs-group">
                  <path d="M 85 75 Q 110 95 120 112 Q 125 80 140 60 Q 155 80 160 112 Q 170 95 195 75 C 185 30, 95 30, 85 75 Z" fill="url(#hairPink)" />
                  <!-- Hair Highlight Sheen -->
                  <path d="M 100 45 Q 140 30 180 45" stroke="#00f0ff" stroke-width="3" fill="none" opacity="0.75" />
                </g>

                <!-- Cyber Headset & Mech Samurai Ears -->
                <g id="headset-group">
                  <rect x="70" y="85" width="16" height="36" rx="6" fill="#1e293b" stroke="#00f0ff" stroke-width="2" />
                  <circle cx="78" cy="103" r="4" fill="#ff007f" class="animate-ping" />
                  <rect x="194" y="85" width="16" height="36" rx="6" fill="#1e293b" stroke="#00f0ff" stroke-width="2" />
                  <circle cx="202" cy="103" r="4" fill="#ff007f" />
                  <!-- Headband Strap -->
                  <path d="M 78 88 C 80 30, 200 30, 202 88" stroke="#0f172a" stroke-width="6" fill="none" />
                  <path d="M 78 88 C 80 30, 200 30, 202 88" stroke="#00f0ff" stroke-width="2" fill="none" />
                </g>

                <!-- INTERACTIVE CYBER VISOR HUD (Slides down over eyes on Password focus) -->
                <g id="cyberVisor" class="cyber-visor">
                  <!-- Visor Shield -->
                  <path d="M 80 88 L 200 88 L 190 132 Q 140 145 90 132 Z" fill="url(#visorGlass)" stroke="#00f0ff" stroke-width="2.5" />
                  <!-- Visor Glitch HUD Graphics -->
                  <line x1="95" y1="105" x2="185" y2="105" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="4 2" />
                  <text x="140" y="122" font-family="Orbitron" font-size="10" fill="#00f0ff" font-weight="bold" text-anchor="middle" letter-spacing="2">
                    [LOCKED]
                  </text>
                  <!-- Glowing Corner Accents -->
                  <circle cx="92" cy="98" r="2" fill="#00f0ff" />
                  <circle cx="188" cy="98" r="2" fill="#00f0ff" />
                </g>

              </g> <!-- End Head Group -->

            </svg>
          </div>

          <!-- Neon Cyber Ring Platform Below Character -->
          <div class="w-52 h-4 border-2 border-cyberCyan/60 rounded-full blur-[1px] shadow-[0_0_15px_#00f0ff] mt-2 animate-pulse"></div>
        </div>

        <!-- RIGHT COLUMN: Cyberpunk Glass Form -->
        <div class="lg:col-span-7 flex flex-col justify-center">
          
          <div class="mb-6">
            <h2 class="text-2xl md:text-3xl font-extrabold font-orbitron text-white tracking-wide">
              OPERATIVE LOGIN
            </h2>
            <p class="text-xs md:text-sm text-slate-300 font-medium mt-1">
              Enter your clearance credentials to access the matrix.
            </p>
          </div>

          <form id="cyberLoginForm" class="space-y-5" onsubmit="handleCyberSubmit(event)">
            
            <!-- Email Input Field -->
            <div class="space-y-1.5">
              <label for="email" class="block text-xs font-bold font-orbitron tracking-widest text-cyberCyan uppercase">
                // USER IDENTITY (EMAIL) <span class="text-cyberPink">*</span>
              </label>
              <div class="relative flex items-center">
                <span class="absolute left-4 text-cyberCyan">
                  <i class="fa-solid fa-terminal"></i>
                </span>
                <input 
                  type="email" 
                  id="email" 
                  required
                  placeholder="samurai@cyberpunk.net" 
                  class="cyber-input w-full pl-11 pr-4 py-3.5 bg-slate-900/80 hover:bg-slate-900 text-white placeholder-slate-500 font-rajdhani font-semibold text-base rounded-xl border border-cyberCyan/40 focus:outline-none transition-all duration-200"
                />
              </div>
            </div>

            <!-- Password Input Field -->
            <div class="space-y-1.5">
              <label for="password" class="block text-xs font-bold font-orbitron tracking-widest text-cyberCyan uppercase">
                // PASSCODE ENCRYPTION <span class="text-cyberPink">*</span>
              </label>
              <div class="relative flex items-center">
                <span class="absolute left-4 text-cyberPink">
                  <i class="fa-solid fa-shield-halved"></i>
                </span>
                <input 
                  type="password" 
                  id="password" 
                  required
                  placeholder="••••••••••••••••" 
                  class="cyber-input w-full pl-11 pr-12 py-3.5 bg-slate-900/80 hover:bg-slate-900 text-white placeholder-slate-500 font-rajdhani font-semibold text-base rounded-xl border border-cyberPink/40 focus:outline-none transition-all duration-200"
                />
                <!-- Eye Password Visibility Toggle -->
                <button 
                  type="button" 
                  id="togglePasswordBtn" 
                  aria-label="Toggle Password Visibility"
                  class="absolute right-3 p-2 text-slate-400 hover:text-cyberCyan focus:outline-none transition-colors"
                >
                  <i id="eyeIcon" class="fa-regular fa-eye text-base"></i>
                </button>
              </div>
            </div>

            <!-- Options Row -->
            <div class="flex items-center justify-between text-xs font-bold tracking-wider text-slate-300 pt-1">
              <label class="flex items-center space-x-2 cursor-pointer select-none">
                <input type="checkbox" class="w-4 h-4 rounded bg-slate-900 border-cyberCyan text-cyberPink focus:ring-cyberPink" />
                <span>SAVE CYBER ID</span>
              </label>
              <a href="#" class="hover:text-cyberCyan transition-colors hover:underline">RESET CIPHER?</a>
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
              <button 
                type="submit" 
                id="submitBtn" 
                class="cyber-btn-cut w-full bg-gradient-to-r from-cyberCyan via-cyberPurple to-cyberPink hover:opacity-90 text-slate-950 font-orbitron font-extrabold py-4 px-6 rounded-lg shadow-[0_0_25px_rgba(0,240,255,0.4)] active:scale-[0.98] transition-all duration-200 flex items-center justify-center space-x-3 tracking-widest"
              >
                <span id="btnText" class="text-sm md:text-base">EXECUTE ACCESS</span>
                <i id="btnSpinner" class="fa-solid fa-sync fa-spin hidden text-lg"></i>
              </button>
            </div>

          </form>

          <!-- Social Matrix Options -->
          <div class="mt-6 pt-4 border-t border-slate-800 text-center">
            <p class="text-xs font-orbitron font-bold text-slate-400 tracking-widest mb-3 uppercase">// ALTERNATE PROTOCOLS</p>
            <div class="flex justify-center space-x-4">
              <button type="button" class="px-5 py-2.5 bg-slate-900/90 hover:border-cyberCyan border border-slate-700 text-white rounded-xl text-xs font-orbitron font-bold flex items-center space-x-2 transition-all glow-cyan">
                <i class="fa-brands fa-github text-cyberCyan text-sm"></i>
                <span>GITHUB</span>
              </button>
              <button type="button" class="px-5 py-2.5 bg-slate-900/90 hover:border-cyberPink border border-slate-700 text-white rounded-xl text-xs font-orbitron font-bold flex items-center space-x-2 transition-all glow-pink">
                <i class="fa-brands fa-discord text-cyberPink text-sm"></i>
                <span>DISCORD</span>
              </button>
            </div>
          </div>

        </div>

      </div>
    </div>
  </main>

  <!-- Cyber System Toast Banner -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-900/95 text-white px-6 py-4 rounded-2xl shadow-[0_0_30px_rgba(0,240,255,0.5)] transition-all duration-300 transform translate-y-24 opacity-0 flex items-center space-x-4 z-50 border border-cyberCyan">
    <div class="w-10 h-10 rounded-xl bg-cyberCyan/20 flex items-center justify-center text-cyberCyan text-xl border border-cyberCyan">
      <i id="toastIcon" class="fa-solid fa-circle-check"></i>
    </div>
    <div>
      <h4 id="toastTitle" class="text-sm font-orbitron font-bold text-cyberCyan tracking-wider">ACCESS GRANTED</h4>
      <p id="toastMessage" class="text-xs text-slate-300 font-rajdhani font-semibold">Welcome back, Operative.</p>
    </div>
  </div>

  <script>
    // Elements
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');
    
    // Character Layers
    const headGroup = document.getElementById('headGroup');
    const pupilLeft = document.getElementById('pupilLeft');
    const pupilRight = document.getElementById('pupilRight');
    const cyberVisor = document.getElementById('cyberVisor');
    const cyberMouth = document.getElementById('cyberMouth');

    // Submit Elements
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    let isPasswordVisible = false;

    /* 1. NATURAL EYE BLINKING ENGINE */
    function scheduleBlink() {
      const interval = Math.random() * 3200 + 2000;
      setTimeout(() => {
        if (!passwordInput.matches(':focus') && !cyberVisor.classList.contains('visor-locked')) {
          pupilLeft.style.transform = 'scaleY(0.1)';
          pupilRight.style.transform = 'scaleY(0.1)';
          setTimeout(() => {
            pupilLeft.style.transform = 'scaleY(1)';
            pupilRight.style.transform = 'scaleY(1)';
          }, 140);
        }
        scheduleBlink();
      }, interval);
    }
    scheduleBlink();

    /* 2. RESET CHARACTER POSE */
    function resetCharacterPose() {
      headGroup.style.transform = 'rotate(0deg) translateY(0px)';
      pupilLeft.style.transform = 'translate(0px, 0px)';
      pupilRight.style.transform = 'translate(0px, 0px)';
      cyberVisor.classList.remove('visor-locked', 'visor-peek');
      cyberMouth.setAttribute('d', 'M 130 142 Q 140 148 150 142'); // Default cool smirk
    }

    /* 3. EMAIL INPUT TRACKING (Head Tilt & Pupil Follow) */
    emailInput.addEventListener('focus', () => {
      resetCharacterPose();
      headGroup.style.transform = 'rotate(4deg) translateY(3px)';
      updateEyeTracking();
    });

    emailInput.addEventListener('input', updateEyeTracking);

    function updateEyeTracking() {
      if (document.activeElement !== emailInput) return;
      const textLen = emailInput.value.length;
      const moveX = Math.min(Math.max(textLen * 0.45 - 5, -5), 8);
      const moveY = 3;
      pupilLeft.style.transform = `translate(${moveX}px, ${moveY}px)`;
      pupilRight.style.transform = `translate(${moveX}px, ${moveY}px)`;
    }

    emailInput.addEventListener('blur', () => {
      if (document.activeElement !== passwordInput) {
        resetCharacterPose();
      }
    });

    /* 4. PASSWORD INPUT (Visor Drops Down Over Eyes) */
    passwordInput.addEventListener('focus', () => {
      headGroup.style.transform = 'rotate(-3deg) translateY(2px)';
      pupilLeft.style.transform = 'translate(0px, 0px)';
      pupilRight.style.transform = 'translate(0px, 0px)';

      if (isPasswordVisible) {
        cyberVisor.classList.remove('visor-locked');
        cyberVisor.classList.add('visor-peek');
        cyberMouth.setAttribute('d', 'M 130 140 Q 140 152 150 140'); // Playful wink smile
      } else {
        cyberVisor.classList.remove('visor-peek');
        cyberVisor.classList.add('visor-locked');
        cyberMouth.setAttribute('d', 'M 132 144 L 148 144'); // Serious line
      }
    });

    passwordInput.addEventListener('blur', () => {
      if (document.activeElement !== emailInput) {
        resetCharacterPose();
      }
    });

    /* 5. TOGGLE PASSWORD VISIBILITY (Cyber Peek Mode) */
    togglePasswordBtn.addEventListener('click', () => {
      isPasswordVisible = !isPasswordVisible;

      if (isPasswordVisible) {
        passwordInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');

        if (document.activeElement === passwordInput) {
          cyberVisor.classList.remove('visor-locked');
          cyberVisor.classList.add('visor-peek');
          cyberMouth.setAttribute('d', 'M 130 140 Q 140 152 150 140');
        }
      } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');

        if (document.activeElement === passwordInput) {
          cyberVisor.classList.remove('visor-peek');
          cyberVisor.classList.add('visor-locked');
          cyberMouth.setAttribute('d', 'M 132 144 L 148 144');
        }
      }
    });

    /* 6. FORM SUBMIT & VICTORY POSE */
    function handleCyberSubmit(event) {
      event.preventDefault();

      btnText.textContent = 'AUTHENTICATING MATRIX...';
      btnSpinner.classList.remove('hidden');
      submitBtn.disabled = true;

      // Victory Character Pose
      resetCharacterPose();
      headGroup.style.transform = 'rotate(-4deg) translateY(-6px)';
      cyberMouth.setAttribute('d', 'M 128 138 Q 140 156 152 138'); // Open joyful smile

      // Trigger burst particle explosion
      triggerCyberBurst();

      setTimeout(() => {
        btnText.textContent = 'EXECUTE ACCESS';
        btnSpinner.classList.add('hidden');
        submitBtn.disabled = false;

        showToast('SYSTEM CLEARANCE GRANTED', 'Welcome to the Neon Cyber Matrix.');
      }, 1800);
    }

    /* 7. SYSTEM TOAST BANNER */
    function showToast(title, message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastTitle').textContent = title;
      document.getElementById('toastMessage').textContent = message;

      toast.classList.remove('translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-24', 'opacity-0');
      }, 4000);
    }

    /* 8. CANVAS MATRIX & CYBER PARTICLES ENGINE */
    const canvas = document.getElementById('cyberCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class CyberParticle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 1;
        this.speedY = -(Math.random() * 1.2 + 0.3);
        this.speedX = (Math.random() - 0.5) * 0.8;
        this.color = Math.random() > 0.5 ? '#00f0ff' : '#ff007f';
        this.opacity = Math.random() * 0.8 + 0.2;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        if (this.y < 0) {
          this.reset();
          this.y = canvas.height + 10;
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 45; i++) {
      particles.push(new CyberParticle());
    }

    function triggerCyberBurst() {
      for (let i = 0; i < 30; i++) {
        const p = new CyberParticle();
        p.x = canvas.width / 2;
        p.y = canvas.height / 2;
        p.speedY = (Math.random() - 0.5) * 8;
        p.speedX = (Math.random() - 0.5) * 8;
        p.size = Math.random() * 4 + 2;
        particles.push(p);
      }
    }

    function animateCyberGrid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Subtle Background Cyber Grid
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.04)';
      ctx.lineWidth = 1;
      const gridSize = 40;

      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animateCyberGrid);
    }
    animateCyberGrid();
  </script>
</body>
</html>

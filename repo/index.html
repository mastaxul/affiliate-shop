<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - [Nama Anda]</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Loading / Welcome Screen dengan Kilatan -->
  <div id="loader-overlay">
    <div class="loader-content">
      <h1 class="welcome-title">Welcome To My<br><span class="highlight-blue">Portofolio Website</span></h1>
      <div class="loading-status">
        <span>Loading</span>
        <span id="loading-percent">0%</span>
      </div>
      <div class="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- Canvas Galaksi & Animasi Kilat -->
  <canvas id="galaxyCanvas"></canvas>

  <!-- Kandungan Utama Portfolio -->
  <div class="content-wrapper" id="main-content">
    <nav class="navbar">
      <div class="logo"><span class="logo-text">[ LOGO / NAMA ]</span></div>
      <ul class="nav-links">
        <li><a href="#hero">Utama</a></li>
        <li><a href="#about">Tentang</a></li>
        <li><a href="#projects">Projek</a></li>
        <li><a href="#skills">Kemahiran</a></li>
        <li><a href="#contact">Hubungi</a></li>
      </ul>
    </nav>

    <section id="hero" class="hero-section glass-card">
      <div class="hero-content">
        <div class="profile-img-container">
          <img src="https://via.placeholder.com/150/1a1a2e/ffffff?text=Profil" alt="Gambar Profil" class="profile-img">
        </div>
        <h1>Hai, Saya <span class="highlight">[Nama Anda]</span></h1>
        <p class="tagline">[Kerjaya / Kepakaran Anda]</p>
        <div class="hero-buttons">
          <a href="#projects" class="btn btn-primary">Lihat Projek</a>
          <a href="#contact" class="btn btn-outline">Hubungi Saya</a>
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>

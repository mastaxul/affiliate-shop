<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#030303">
<meta name="color-scheme" content="dark">
<title>COUNTDOWN</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020202;
    color: #fff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}
/* =========================================================
   BACKGROUND
========================================================= */
body {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(
            ellipse at 50% 48%,
            rgba(100, 0, 0, .15) 0%,
            rgba(35, 0, 0, .10) 25%,
            #050303 52%,
            #010101 100%
        );
}
/* dark vignette */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.55) 75%,
            rgba(0,0,0,.92) 100%
        );
}
/* =========================================================
   ATMOSPHERE
========================================================= */
.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}
/* red moon */
.moon {
    position: absolute;
    width: min(34vw, 360px);
    height: min(34vw, 360px);
    min-width: 190px;
    min-height: 190px;
    top: 4%;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 50%;
    background:
        radial-gradient(
            circle at 35% 30%,
            #241010,
            #100607 48%,
            #030202 76%
        );
    box-shadow:
        0 0 30px rgba(130, 0, 0, .15),
        0 0 100px rgba(100, 0, 0, .08);
    opacity: .8;
}
/* moon texture */
.moon::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
        radial-gradient(circle at 25% 35%, rgba(100,0,0,.15), transparent 7%),
        radial-gradient(circle at 70% 25%, rgba(150,0,0,.08), transparent 9%),
        radial-gradient(circle at 55% 70%, rgba(100,0,0,.10), transparent 8%),
        radial-gradient(circle at 30% 75%, rgba(255,255,255,.02), transparent 10%);
}
/* =========================================================
   FOG
========================================================= */
.fog {
    position: absolute;
    width: 180%;
    height: 40%;
    left: -40%;
    bottom: -8%;
    background:
        radial-gradient(
            ellipse,
            rgba(110, 110, 110, .13),
            transparent 68%
        );
    filter: blur(35px);
    animation:
        fogMove 18s ease-in-out infinite alternate,
        fogPulse 9s ease-in-out infinite;
}
.fog.two {
    bottom: 5%;
    opacity: .45;
    animation-duration: 25s;
    animation-direction: alternate-reverse;
}
@keyframes fogMove {
    from {
        transform: translateX(-7%);
    }
    to {
        transform: translateX(7%);
    }
}
@keyframes fogPulse {
    0%,100% {
        opacity: .35;
    }
    50% {
        opacity: .65;
    }
}
/* =========================================================
   PARTICLES
========================================================= */
#particles {
    position: absolute;
    inset: 0;
}
.particle {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #8d8d8d;
    opacity: .2;
    animation:
        particleFloat linear infinite;
}
@keyframes particleFloat {
    0% {
        transform:
            translate3d(0, 30px, 0);
        opacity: 0;
    }
    20% {
        opacity: .3;
    }
    80% {
        opacity: .15;
    }
    100% {
        transform:
            translate3d(20px, -180px, 0);
        opacity: 0;
    }
}
/* =========================================================
   LIGHTNING
========================================================= */
.lightning {
    position: fixed;
    inset: 0;
    z-index: 40;
    pointer-events: none;
    opacity: 0;
    background:
        rgba(255,255,255,.18);
}
.lightning.flash {
    animation: lightningFlash .48s ease-out;
}
@keyframes lightningFlash {
    0% {
        opacity: 0;
    }
    5% {
        opacity: .22;
    }
    9% {
        opacity: 0;
    }
    15% {
        opacity: .08;
    }
    20% {
        opacity: 0;
    }
    100% {
        opacity: 0;
    }
}
/* =========================================================
   LIGHTNING BOLT
========================================================= */
.bolt {
    position: fixed;
    z-index: 41;
    top: -5%;
    left: 50%;
    width: 5px;
    height: 65vh;
    opacity: 0;
    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,.95) 15%,
            rgba(255,30,30,.9) 48%,
            rgba(255,255,255,.85) 75%,
            transparent
        );
    clip-path: polygon(
        55% 0,
        40% 25%,
        62% 25%,
        34% 55%,
        55% 55%,
        15% 100%,
        40% 58%,
        22% 58%,
        48% 30%,
        31% 30%
    );
    filter:
        drop-shadow(0 0 8px rgba(255,0,0,.9))
        drop-shadow(0 0 25px rgba(255,0,0,.4));
}
.bolt.strike {
    animation: boltStrike .45s ease-out;
}
@keyframes boltStrike {
    0% {
        opacity: 0;
        transform: translateX(-10px) scaleY(.2);
    }
    15% {
        opacity: 1;
    }
    30% {
        opacity: .25;
    }
    42% {
        opacity: .9;
    }
    100% {
        opacity: 0;
        transform: translateX(15px) scaleY(1);
    }
}
/* =========================================================
   MAIN
========================================================= */
.main {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
/* =========================================================
   TITLE
========================================================= */
.title {
    text-align: center;
    color: #d8d8d8;
    font-size:
        clamp(20px, 4vw, 40px);
    font-weight: 900;
    letter-spacing:
        clamp(4px, 1vw, 10px);
    text-transform: uppercase;
    text-shadow:
        0 0 10px rgba(255,255,255,.10),
        0 0 35px rgba(255,0,0,.08);
    margin-bottom: 5px;
}
.subtitle {
    margin-top: 9px;
    font-size: 9px;
    letter-spacing: 4px;
    color: #663333;
}
/* =========================================================
   PYRAMID AREA
========================================================= */
.pyramid-area {
    position: relative;
    width: min(430px, 82vw);
    height: min(330px, 48vh);
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 900px;
}
/* red aura */
.pyramid-glow {
    position: absolute;
    width: 65%;
    height: 55%;
    border-radius: 50%;
    background:
        radial-gradient(
            ellipse,
            rgba(170,0,0,.28),
            rgba(60,0,0,.08) 45%,
            transparent 72%
        );
    filter: blur(30px);
    animation:
        auraPulse 4s ease-in-out infinite;
}
@keyframes auraPulse {
    0%,100% {
        transform: scale(.92);
        opacity: .55;
    }
    50% {
        transform: scale(1.08);
        opacity: .9;
    }
}
/* =========================================================
   3D PYRAMID
========================================================= */
.pyramid-3d {
    position: relative;
    width: 270px;
    height: 230px;
    transform-style: preserve-3d;
    transform:
        rotateX(7deg)
        rotateY(-7deg);
    animation:
        pyramidFloat 6s ease-in-out infinite;
}
@keyframes pyramidFloat {
    0%,100% {
        transform:
            rotateX(7deg)
            rotateY(-7deg)
            translateY(0);
    }
    50% {
        transform:
            rotateX(9deg)
            rotateY(7deg)
            translateY(-7px);
    }
}
/* pyramid faces */
.face {
    position: absolute;
    width: 0;
    height: 0;
    left: 50%;
    top: 0;
    transform-origin: 50% 0;
}
/* front */
.face.front {
    border-left:
        135px solid transparent;
    border-right:
        135px solid transparent;
    border-bottom:
        225px solid #070303;
    transform:
        translateX(-50%)
        rotateY(0deg);
    filter:
        drop-shadow(0 15px 20px rgba(0,0,0,.9));
}
/* left */
.face.left {
    border-left:
        135px solid transparent;
    border-right:
        135px solid transparent;
    border-bottom:
        225px solid #120505;
    transform:
        translateX(-50%)
        rotateY(90deg);
    opacity: .9;
}
/* right */
.face.right {
    border-left:
        135px solid transparent;
    border-right:
        135px solid transparent;
    border-bottom:
        225px solid #020202;
    transform:
        translateX(-50%)
        rotateY(-90deg);
    opacity: .95;
}
/* =========================================================
   PYRAMID RED CRACKS
========================================================= */
.crack {
    position: absolute;
    z-index: 5;
    width: 3px;
    background:
        linear-gradient(
            to bottom,
            transparent,
            #ff1818 25%,
            #7b0000 75%,
            transparent
        );
    box-shadow:
        0 0 5px #ff0000,
        0 0 15px rgba(255,0,0,.7),
        0 0 30px rgba(255,0,0,.25);
    opacity: .85;
    transform-origin: top;
}
.crack.one {
    height: 120px;
    left: 42%;
    top: 40px;
    transform: rotate(18deg);
}
.crack.two {
    height: 95px;
    left: 54%;
    top: 80px;
    transform: rotate(-22deg);
}
.crack.three {
    height: 75px;
    left: 49%;
    top: 125px;
    transform: rotate(12deg);
}
.crack.four {
    height: 50px;
    left: 36%;
    top: 135px;
    transform: rotate(-17deg);
}
.crack {
    animation:
        crackPulse 3s ease-in-out infinite;
}
@keyframes crackPulse {
    0%,100% {
        opacity: .35;
        filter: brightness(.7);
    }
    50% {
        opacity: 1;
        filter: brightness(1.8);
    }
}
/* =========================================================
   PYRAMID EYE
========================================================= */
.eye {
    position: absolute;
    z-index: 20;
    left: 50%;
    top: 30%;
    width: 48px;
    height: 48px;
    transform:
        translate(-50%, -50%)
        rotate(45deg);
    border:
        2px solid #7a0808;
    background:
        radial-gradient(
            circle,
            #180000,
            #030000 65%
        );
    box-shadow:
        0 0 10px rgba(255,0,0,.5),
        0 0 30px rgba(255,0,0,.25);
    animation:
        eyePulse 2.5s ease-in-out infinite;
}
.eye::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 15px;
    height: 15px;
    transform:
        translate(-50%, -50%)
        rotate(-45deg);
    border-radius: 50%;
    background: #ff1717;
    box-shadow:
        0 0 8px #ff0000,
        0 0 25px #ff0000,
        0 0 50px rgba(255,0,0,.8);
}
.eye::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 22px;
    transform:
        translate(-50%, -50%)
        rotate(-45deg);
    background: #020000;
    border-radius: 50%;
}
@keyframes eyePulse {
    0%,100% {
        filter: brightness(.75);
        box-shadow:
            0 0 8px rgba(255,0,0,.3);
    }
    50% {
        filter: brightness(1.5);
        box-shadow:
            0 0 15px rgba(255,0,0,.8),
            0 0 45px rgba(255,0,0,.4);
    }
}
/* =========================================================
   COUNTDOWN
========================================================= */
.countdown {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 10px;
    max-width: 1000px;
    margin-top: -4px;
    padding: 0 10px;
}
.unit {
    min-width: 82px;
    text-align: center;
}
.number {
    font-size:
        clamp(27px, 5vw, 52px);
    line-height: 1;
    font-weight: 900;
    color: #b30000;
    letter-spacing: 2px;
    text-shadow:
        0 0 5px rgba(255,0,0,.4),
        0 0 18px rgba(255,0,0,.25);
    transition:
        transform .15s ease;
}
.number.tick {
    transform: scale(1.04);
}
.label {
    margin-top: 8px;
    font-size: 9px;
    color: #6d4b4b;
    letter-spacing: 3px;
    text-transform: uppercase;
}
.separator {
    color: #4b0909;
    font-size: 30px;
    line-height: 1;
    text-shadow:
        0 0 8px rgba(255,0,0,.3);
}
/* =========================================================
   TARGET
========================================================= */
.target {
    margin-top: 22px;
    font-size: 9px;
    letter-spacing: 3px;
    color: #684444;
    text-align: center;
    text-transform: uppercase;
}
/* =========================================================
   STATUS
========================================================= */
.status {
    margin-top: 8px;
    font-size: 8px;
    letter-spacing: 3px;
    color: #381919;
    text-transform: uppercase;
}
.status.active::before {
    content: "● ";
    color: #8b0000;
    animation:
        statusBlink 1.5s infinite;
}
@keyframes statusBlink {
    0%,100% {
        opacity: .25;
    }
    50% {
        opacity: 1;
    }
}
/* =========================================================
   MOBILE
========================================================= */
@media (max-width: 650px) {
    .title {
        font-size: 20px;
        letter-spacing: 4px;
        margin-bottom: 0;
    }
    .subtitle {
        font-size: 7px;
        letter-spacing: 2px;
    }
    .pyramid-area {
        height: 230px;
    }
    .pyramid-3d {
        transform: scale(.72);
    }
    .countdown {
        gap: 5px;
    }
    .unit {
        min-width: 48px;
    }
    .number {
        font-size: 25px;
    }
    .label {
        font-size: 6px;
        letter-spacing: 1px;
    }
    .separator {
        font-size: 18px;
    }
    .target {
        margin-top: 15px;
        font-size: 7px;
        letter-spacing: 2px;
    }
}
/* =========================================================
   SMALL HEIGHT DEVICES
========================================================= */
@media (max-height: 700px) {
    .moon {
        top: -8%;
    }
    .title {
        margin-bottom: -10px;
    }
    .pyramid-area {
        height: 180px;
    }
    .pyramid-3d {
        transform: scale(.58);
    }
    .countdown {
        margin-top: -15px;
    }
    .target {
        margin-top: 10px;
    }
}
</style>
</head>
<body>
<!-- =======================================================
     ATMOSPHERE
======================================================= -->
<div class="sky">
    <div class="moon"></div>
    <div class="fog"></div>
    <div class="fog two"></div>
    <div id="particles"></div>
</div>
<div class="lightning" id="lightning"></div>
<div class="bolt" id="bolt"></div>
<!-- =======================================================
     MAIN
======================================================= -->
<main class="main">
    <div class="title">
        COUNTDOWN
        <div class="subtitle">
            THE CYCLE MUST END
        </div>
    </div>
    <!-- ===================================================
         PYRAMID
    ==================================================== -->
    <div class="pyramid-area">
        <div class="pyramid-glow"></div>
        <div class="pyramid-3d">
            <div class="face front"></div>
            <div class="face left"></div>
            <div class="face right"></div>
            <div class="crack one"></div>
            <div class="crack two"></div>
            <div class="crack three"></div>
            <div class="crack four"></div>
            <div class="eye"></div>
        </div>
    </div>
    <!-- ===================================================
         COUNTDOWN
    ==================================================== -->
    <div class="countdown">
        <div class="unit">
            <div class="number" id="years">00</div>
            <div class="label">Tahun</div>
        </div>
        <div class="separator">:</div>
        <div class="unit">
            <div class="number" id="months">00</div>
            <div class="label">Bulan</div>
        </div>
        <div class="separator">:</div>
        <div class="unit">
            <div class="number" id="days">00</div>
            <div class="label">Hari</div>
        </div>
        <div class="separator">:</div>
        <div class="unit">
            <div class="number" id="hours">00</div>
            <div class="label">Jam</div>
        </div>
        <div class="separator">:</div>
        <div class="unit">
            <div class="number" id="minutes">00</div>
            <div class="label">Minit</div>
        </div>
        <div class="separator">:</div>
        <div class="unit">
            <div class="number" id="seconds">00</div>
            <div class="label">Saat</div>
        </div>
    </div>
    <div class="target">
        BE SAFE BE CONECTED
    </div>
    <div class="status active" id="status">
        SYSTEM ACTIVE
    </div>
</main>
<script>
/* =========================================================
   THE DARK COUNTDOWN
   TARGET:
   03 JUNE 2027
   23:32:09
   SINGAPORE TIME / UTC+8
   The target is converted to an absolute Unix timestamp.
   This means the countdown is UNIVERSAL.
   It does NOT depend on the user's local timezone.
========================================================= */
/* =========================================================
   TARGET TIMESTAMP
========================================================= */
/*
   Singapore Time = UTC+8
   2027-06-03 23:32:09 Singapore
   =
   2027-06-03 15:32:09 UTC
*/
const TARGET_TIMESTAMP =
    Date.UTC(
        2027,
        5,
        3,
        15,
        32,
        9
    );
/* =========================================================
   ELEMENTS
========================================================= */
const yearsEl =
    document.getElementById("years");
const monthsEl =
    document.getElementById("months");
const daysEl =
    document.getElementById("days");
const hoursEl =
    document.getElementById("hours");
const minutesEl =
    document.getElementById("minutes");
const secondsEl =
    document.getElementById("seconds");
const statusEl =
    document.getElementById("status");
/* =========================================================
   NUMBER FORMAT
========================================================= */
function pad(number) {
    return String(number)
        .padStart(2, "0");
}
/* =========================================================
   CALCULATE CALENDAR DIFFERENCE
========================================================= */
function calculateDifference(now) {
    const target =
        new Date(TARGET_TIMESTAMP);
    /*
       Start with calendar years.
    */
    let years = 0;
    let months = 0;
    let cursor =
        new Date(now);
    /*
       If current date is already at/after
       the target, return zero.
    */
    if (cursor >= target) {
        return {
            years: 0,
            months: 0,
            days: 0,
            hours: 0,
            minutes: 0,
            seconds: 0,
            expired: true
        };
    }
    /* ==========================================
       YEARS
    ========================================== */
    while (true) {
        const next =
            new Date(cursor);
        next.setFullYear(
            next.getFullYear() + 1
        );
        if (next <= target) {
            cursor = next;
            years++;
        } else {
            break;
        }
    }
    /* ==========================================
       MONTHS
    ========================================== */
    while (true) {
        const next =
            new Date(cursor);
        next.setMonth(
            next.getMonth() + 1
        );
        if (next <= target) {
            cursor = next;
            months++;
        } else {
            break;
        }
    }
    /* ==========================================
       REMAINING TIME
    ========================================== */
    let remaining =
        TARGET_TIMESTAMP -
        cursor.getTime();
    const DAY =
        24 * 60 * 60 * 1000;
    const HOUR =
        60 * 60 * 1000;
    const MINUTE =
        60 * 1000;
    const SECOND =
        1000;
    const days =
        Math.floor(
            remaining / DAY
        );
    remaining %= DAY;
    const hours =
        Math.floor(
            remaining / HOUR
        );
    remaining %= HOUR;
    const minutes =
        Math.floor(
            remaining / MINUTE
        );
    remaining %= MINUTE;
    const seconds =
        Math.floor(
            remaining / SECOND
        );
    return {
        years,
        months,
        days,
        hours,
        minutes,
        seconds,
        expired: false
    };
}
/* =========================================================
   UPDATE DISPLAY
========================================================= */
function updateCountdown() {
    const now =
        new Date();
    const result =
        calculateDifference(now);
    yearsEl.textContent =
        pad(result.years);
    monthsEl.textContent =
        pad(result.months);
    daysEl.textContent =
        pad(result.days);
    hoursEl.textContent =
        pad(result.hours);
    minutesEl.textContent =
        pad(result.minutes);
    secondsEl.textContent =
        pad(result.seconds);
    /*
       When target is reached.
    */
    if (result.expired) {
        statusEl.textContent =
            "THE CYCLE HAS ENDED";
        statusEl.classList.remove(
            "active"
        );
        return;
    }
    statusEl.textContent =
        "SYSTEM ACTIVE";
}
/* =========================================================
   PARTICLES
========================================================= */
function createParticles() {
    const container =
        document.getElementById(
            "particles"
        );
    for (
        let i = 0;
        i < 90;
        i++
    ) {
        const particle =
            document.createElement(
                "div"
            );
        particle.className =
            "particle";
        particle.style.left =
            Math.random() * 100 + "%";
        particle.style.top =
            Math.random() * 100 + "%";
        particle.style.animationDuration =
            (8 + Math.random() * 18) +
            "s";
        particle.style.animationDelay =
            (-Math.random() * 20) +
            "s";
        container.appendChild(
            particle
        );
    }
}
/* =========================================================
   LIGHTNING
========================================================= */
function lightningStrike() {
    const flash =
        document.getElementById(
            "lightning"
        );
    const bolt =
        document.getElementById(
            "bolt"
        );
    /*
       Reset animations.
    */
    flash.classList.remove(
        "flash"
    );
    bolt.classList.remove(
        "strike"
    );
    /*
       Force browser reflow.
    */
    void flash.offsetWidth;
    void bolt.offsetWidth;
    /*
       Start flash.
    */
    flash.classList.add(
        "flash"
    );
    /*
       Move bolt randomly.
    */
    bolt.style.left =
        (35 + Math.random() * 30) +
        "%";
    bolt.classList.add(
        "strike"
    );
}
/* =========================================================
   RANDOM LIGHTNING TIMER
========================================================= */
function randomLightning() {
    const delay =
        3500 +
        Math.random() * 12000;
    setTimeout(() => {
        lightningStrike();
        /*
           Sometimes create a second strike.
        */
        if (
            Math.random() > .55
        ) {
            setTimeout(
                lightningStrike,
                100 + Math.random() * 180
            );
        }
        randomLightning();
    }, delay);
}
/* =========================================================
   START
========================================================= */
createParticles();
updateCountdown();
randomLightning();
/*
   Update several times per second so
   the countdown remains visually precise.
*/
setInterval(
    updateCountdown,
    100
);
</script>

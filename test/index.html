<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050000">
<meta name="description" content="Masta Xul — The Dark Countdown">
<title>Masta Xul</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}
html,body{
    width:100%;
    min-height:100%;
    background:#020202;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}
body{
    position:relative;
    min-height:100vh;
    min-height:100svh;
    background:
        radial-gradient(circle at 50% 35%,rgba(120,0,0,.22),transparent 32%),
        radial-gradient(circle at 50% 100%,rgba(90,0,0,.28),transparent 55%),
        #020202;
}
/* =========================
   BACKGROUND
========================= */
.sky{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 50% 25%,rgba(255,0,0,.07),transparent 28%),
        linear-gradient(to bottom,#020202 0%,#080000 55%,#010101 100%);
}
.moon{
    position:absolute;
    width:170px;
    height:170px;
    border-radius:50%;
    left:50%;
    top:5%;
    transform:translateX(-50%);
    background:
        radial-gradient(circle at 35% 30%,#260000 0%,#0d0000 42%,#020202 72%);
    box-shadow:
        0 0 35px rgba(255,0,0,.15),
        0 0 90px rgba(255,0,0,.08);
    opacity:.8;
}
.moon:after{
    content:"";
    position:absolute;
    inset:18px;
    border-radius:50%;
    border:1px solid rgba(255,0,0,.12);
}
/* =========================
   FOG
========================= */
.fog{
    position:fixed;
    width:160%;
    height:45%;
    left:-30%;
    bottom:5%;
    pointer-events:none;
    opacity:.2;
    filter:blur(35px);
    background:
        radial-gradient(ellipse at center,
        rgba(150,0,0,.25),
        rgba(20,0,0,.12) 40%,
        transparent 70%);
    animation:fogMove 18s ease-in-out infinite alternate;
}
.fog.two{
    bottom:25%;
    opacity:.12;
    animation-duration:27s;
    animation-direction:alternate-reverse;
}
@keyframes fogMove{
    from{
        transform:translateX(-5%) scale(1);
    }
    to{
        transform:translateX(8%) scale(1.12);
    }
}
/* =========================
   PARTICLES
========================= */
#particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}
.particle{
    position:absolute;
    width:2px;
    height:2px;
    background:#ff1a1a;
    border-radius:50%;
    opacity:.4;
    box-shadow:0 0 6px #ff0000;
    animation:particleFloat linear infinite;
}
@keyframes particleFloat{
    from{
        transform:translateY(110vh) translateX(0);
        opacity:0;
    }
    15%{
        opacity:.5;
    }
    85%{
        opacity:.4;
    }
    to{
        transform:translateY(-20vh) translateX(50px);
        opacity:0;
    }
}
/* =========================
   LIGHTNING
========================= */
.lightning{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:3;
    opacity:0;
}
.lightning.active{
    animation:lightningFlash .65s ease-out;
}
.bolt{
    position:absolute;
    top:0;
    width:3px;
    height:100%;
    background:linear-gradient(
        to bottom,
        transparent,
        rgba(255,0,0,.9),
        transparent
    );
    filter:
        drop-shadow(0 0 4px #ff0000)
        drop-shadow(0 0 12px #ff0000);
    clip-path:polygon(
        50% 0,
        65% 10%,
        45% 21%,
        70% 35%,
        43% 47%,
        61% 61%,
        38% 76%,
        58% 89%,
        50% 100%
    );
}
.bolt.one{
    left:22%;
    transform:rotate(-4deg);
}
.bolt.two{
    right:19%;
    transform:rotate(5deg);
}
@keyframes lightningFlash{
    0%{opacity:0}
    8%{opacity:1}
    12%{opacity:.1}
    20%{opacity:.8}
    25%{opacity:0}
    40%{opacity:.45}
    44%{opacity:0}
    100%{opacity:0}
}
/* =========================
   MAIN
========================= */
.main{
    position:relative;
    z-index:5;
    width:100%;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:
        max(20px,env(safe-area-inset-top))
        18px
        max(20px,env(safe-area-inset-bottom));
}
/* =========================
   TITLE
========================= */
.title{
    position:relative;
    font-size:clamp(38px,9vw,82px);
    font-weight:900;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#fff;
    text-align:center;
    text-shadow:
        0 0 8px rgba(255,255,255,.2),
        0 0 25px rgba(255,0,0,.25),
        0 0 55px rgba(255,0,0,.15);
    animation:titlePulse 4s ease-in-out infinite;
}
@keyframes titlePulse{
    0%,100%{
        text-shadow:
            0 0 8px rgba(255,255,255,.2),
            0 0 25px rgba(255,0,0,.22),
            0 0 55px rgba(255,0,0,.12);
    }
    50%{
        text-shadow:
            0 0 10px rgba(255,255,255,.35),
            0 0 35px rgba(255,0,0,.45),
            0 0 75px rgba(255,0,0,.2);
    }
}
.subtitle{
    margin-top:8px;
    font-size:clamp(10px,2.5vw,16px);
    letter-spacing:.45em;
    color:#a60000;
    text-align:center;
    text-shadow:0 0 10px #ff0000;
}
/* =========================
   PYRAMID AREA
========================= */
.pyramid-area{
    position:relative;
    width:min(430px,80vw);
    height:min(300px,37vh);
    min-height:230px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:5px 0 0;
}
.pyramid-glow{
    position:absolute;
    width:65%;
    height:30%;
    bottom:4%;
    border-radius:50%;
    background:#f00;
    filter:blur(45px);
    opacity:.13;
    animation:pyramidGlow 4s ease-in-out infinite;
}
@keyframes pyramidGlow{
    0%,100%{
        transform:scale(.9);
        opacity:.09;
    }
    50%{
        transform:scale(1.1);
        opacity:.2;
    }
}
/* =========================
   3D PYRAMID
========================= */
.pyramid-3d{
    position:relative;
    width:230px;
    height:190px;
    transform-style:preserve-3d;
    transform:
        perspective(900px)
        rotateX(4deg)
        rotateY(-2deg);
    animation:pyramidFloat 5s ease-in-out infinite;
}
@keyframes pyramidFloat{
    0%,100%{
        transform:
            perspective(900px)
            rotateX(4deg)
            rotateY(-2deg)
            translateY(0);
    }
    50%{
        transform:
            perspective(900px)
            rotateX(6deg)
            rotateY(2deg)
            translateY(-7px);
    }
}
.face{
    position:absolute;
    left:50%;
    bottom:0;
    width:0;
    height:0;
    transform-origin:50% 100%;
}
.face.front{
    border-left:115px solid transparent;
    border-right:115px solid transparent;
    border-bottom:190px solid #080000;
    transform:translateX(-50%);
    filter:
        drop-shadow(0 0 8px rgba(255,0,0,.35))
        drop-shadow(0 0 30px rgba(255,0,0,.08));
}
.face.left{
    border-left:115px solid transparent;
    border-right:115px solid transparent;
    border-bottom:190px solid #120000;
    transform:
        translateX(-50%)
        rotateY(70deg)
        translateZ(-18px);
    opacity:.85;
}
.face.right{
    border-left:115px solid transparent;
    border-right:115px solid transparent;
    border-bottom:190px solid #050000;
    transform:
        translateX(-50%)
        rotateY(-70deg)
        translateZ(-18px);
    opacity:.8;
}
/* Pyramid red edge */
.pyramid-3d:before,
.pyramid-3d:after{
    content:"";
    position:absolute;
    width:2px;
    height:190px;
    background:linear-gradient(
        to bottom,
        #ff0000,
        rgba(255,0,0,.1)
    );
    left:50%;
    bottom:0;
    transform-origin:bottom;
    box-shadow:
        0 0 5px #f00,
        0 0 15px rgba(255,0,0,.7);
}
.pyramid-3d:before{
    transform:rotate(31deg);
}
.pyramid-3d:after{
    transform:rotate(-31deg);
}
/* =========================
   CRACKS
========================= */
.crack{
    position:absolute;
    height:2px;
    background:#ff0808;
    transform-origin:left center;
    box-shadow:
        0 0 4px #ff0000,
        0 0 12px #ff0000;
    animation:crackPulse 2.7s ease-in-out infinite;
    z-index:4;
}
.crack.one{
    width:74px;
    left:86px;
    top:72px;
    transform:rotate(22deg);
}
.crack.two{
    width:54px;
    left:103px;
    top:95px;
    transform:rotate(-29deg);
    animation-delay:.5s;
}
.crack.three{
    width:67px;
    left:74px;
    top:125px;
    transform:rotate(15deg);
    animation-delay:1s;
}
.crack.four{
    width:48px;
    left:128px;
    top:143px;
    transform:rotate(-17deg);
    animation-delay:1.5s;
}
.crack:after{
    content:"";
    position:absolute;
    width:35%;
    height:1px;
    left:35%;
    top:5px;
    background:#ff0000;
    transform:rotate(35deg);
    box-shadow:0 0 7px #ff0000;
}
@keyframes crackPulse{
    0%,100%{
        opacity:.35;
    }
    50%{
        opacity:1;
    }
}
/* Eye removed - clean pyramid without eye */
/* =========================
   COUNTDOWN
========================= */
.countdown{
    width:min(900px,100%);
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
    margin-top:4px;
}
.unit{
    position:relative;
    text-align:center;
    padding:8px 4px 7px;
    border:1px solid rgba(255,0,0,.18);
    background:
        linear-gradient(
            180deg,
            rgba(50,0,0,.35),
            rgba(5,0,0,.7)
        );
    box-shadow:
        inset 0 0 20px rgba(255,0,0,.04),
        0 0 12px rgba(255,0,0,.04);
    border-radius:4px;
    overflow:hidden;
}
.unit:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        #f00,
        transparent
    );
    opacity:.55;
}
.number{
    position:relative;
    display:block;
    font-size:clamp(27px,6vw,55px);
    line-height:1;
    font-weight:800;
    color:#f1eeee;
    font-variant-numeric:tabular-nums;
    text-shadow:
        0 0 8px rgba(255,0,0,.4),
        0 0 20px rgba(255,0,0,.15);
}
.label{
    display:block;
    margin-top:7px;
    font-size:clamp(8px,1.7vw,11px);
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#8f6969;
}
/* Number animation */
.number.countdown-change{
    animation:numberFlip .42s ease;
}
@keyframes numberFlip{
    0%{
        transform:translateY(-9px) scale(.92);
        opacity:.2;
        filter:blur(2px);
    }
    50%{
        transform:translateY(3px) scale(1.08);
        opacity:1;
        filter:blur(0);
        color:#ff3030;
        text-shadow:
            0 0 8px #f00,
            0 0 25px rgba(255,0,0,.8);
    }
    100%{
        transform:translateY(0) scale(1);
        opacity:1;
        color:#f1eeee;
    }
}
.number.second-pulse{
    animation:secondBloodPulse .35s ease;
}
@keyframes secondBloodPulse{
    0%{
        color:#fff;
    }
    40%{
        color:#ff2020;
        text-shadow:
            0 0 8px #f00,
            0 0 25px #f00;
    }
    100%{
        color:#f1eeee;
    }
}
.separator{
    display:none;
}
/* =========================
   TARGET
========================= */
.target{
    margin-top:12px;
    font-size:clamp(9px,2vw,12px);
    letter-spacing:.28em;
    text-align:center;
    color:#6d5151;
    text-transform:uppercase;
}
.target strong{
    display:block;
    margin-top:5px;
    color:#b30000;
    font-weight:700;
    text-shadow:0 0 8px rgba(255,0,0,.3);
}
/* =========================
   STATUS
========================= */
.status{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:9px;
    font-size:9px;
    letter-spacing:.22em;
    color:#694747;
}
.status-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#d00000;
    box-shadow:
        0 0 6px #f00,
        0 0 14px rgba(255,0,0,.8);
    animation:statusBlink 1.8s ease-in-out infinite;
}
@keyframes statusBlink{
    0%,100%{
        opacity:.35;
    }
    50%{
        opacity:1;
    }
}
/* =========================
   CYCLE RESET
========================= */
.pyramid-3d.cycle-reset{
    animation:pyramidCycleReset 1.2s ease;
}
@keyframes pyramidCycleReset{
    0%{
        transform:
            perspective(900px)
            scale(1)
            rotateX(4deg);
        filter:brightness(1);
    }
    25%{
        transform:
            perspective(900px)
            scale(1.13)
            rotateX(8deg);
        filter:brightness(2.5);
    }
    55%{
        transform:
            perspective(900px)
            scale(.92)
            rotateX(-4deg);
        filter:brightness(1.7);
    }
    100%{
        transform:
            perspective(900px)
            scale(1)
            rotateX(4deg);
        filter:brightness(1);
    }
}
.countdown.cycle-reset{
    animation:countdownCycleReset .9s ease;
}
@keyframes countdownCycleReset{
    0%{
        filter:brightness(1);
    }
    35%{
        filter:brightness(2);
        transform:scale(1.025);
    }
    100%{
        filter:brightness(1);
        transform:scale(1);
    }
}
/* =========================
   MOBILE
========================= */
@media(max-width:600px){
    .moon{
        width:125px;
        height:125px;
        top:4%;
    }
    .main{
        justify-content:center;
        padding-left:12px;
        padding-right:12px;
    }
    .title{
        letter-spacing:.12em;
    }
    .subtitle{
        letter-spacing:.28em;
    }
    .pyramid-area{
        width:300px;
        height:220px;
        min-height:200px;
        margin-top:0;
    }
    .pyramid-3d{
        transform:scale(.78);
    }
    .pyramid-3d:hover{
        transform:scale(.78);
    }
    .countdown{
        gap:4px;
    }
    .unit{
        padding:7px 2px 6px;
    }
    .number{
        font-size:clamp(21px,7vw,34px);
    }
    .label{
        letter-spacing:.08em;
        font-size:7px;
        margin-top:6px;
    }
    .target{
        margin-top:9px;
        letter-spacing:.17em;
    }
    .status{
        margin-top:7px;
    }
}
/* =========================
   VERY SMALL SCREENS
========================= */
@media(max-height:650px){
    .moon{
        top:-35px;
    }
    .title{
        font-size:35px;
    }
    .pyramid-area{
        height:185px;
        min-height:175px;
    }
    .pyramid-3d{
        transform:scale(.63);
    }
    .countdown{
        margin-top:-4px;
    }
    .target{
        margin-top:7px;
    }
}
@media(max-width:380px){
    .title{
        font-size:30px;
    }
    .subtitle{
        font-size:8px;
    }
    .pyramid-area{
        height:190px;
    }
    .number{
        font-size:20px;
    }
    .label{
        font-size:6px;
    }
    .target{
        font-size:7px;
    }
}
</style>
</head>
<body>
<div class="sky"></div>
<div class="moon"></div>
<div class="fog"></div>
<div class="fog two"></div>
<div id="particles"></div>
<div class="lightning">
    <div class="bolt one"></div>
    <div class="bolt two"></div>
</div>
<main class="main">
    <div class="title">Masta Xul</div>
    <div class="subtitle">
        THE CYCLE MUST END
    </div>
    <section class="pyramid-area">
        <div class="pyramid-glow"></div>
        <div class="pyramid-3d" id="pyramid">
            <div class="face front"></div>
            <div class="face left"></div>
            <div class="face right"></div>
            <div class="crack one"></div>
            <div class="crack two"></div>
            <div class="crack three"></div>
            <div class="crack four"></div>
        </div>
    </section>
    <section class="countdown" id="countdown">
        <div class="unit">
            <span class="number" id="years">0</span>
            <span class="label">Tahun</span>
        </div>
        <div class="unit">
            <span class="number" id="months">0</span>
            <span class="label">Bulan</span>
        </div>
        <div class="unit">
            <span class="number" id="days">0</span>
            <span class="label">Hari</span>
        </div>
        <div class="unit">
            <span class="number" id="hours">0</span>
            <span class="label">Jam</span>
        </div>
        <div class="unit">
            <span class="number" id="minutes">0</span>
            <span class="label">Minit</span>
        </div>
        <div class="unit">
            <span class="number" id="seconds">0</span>
            <span class="label">Saat</span>
        </div>
    </section>
    <div class="target">
        TARGET
        <strong>BE SAFE BE CONECTED</strong>
    </div>
    <div class="status">
        <span class="status-dot"></span>
        SYSTEM ACTIVE
    </div>
</main>

<!-- Background Music -->
<audio id="bgMusic" loop preload="auto">
    <source src="https://raw.githubusercontent.com/FireEntity1/rythm-2d-platformer/main/Audio/Darkside%20-%20Nightcore.mp3" type="audio/mpeg">
</audio>

<script>
/* =========================================================
   MASTA XUL — UNIVERSAL ANNUAL DARK COUNTDOWN
   Target:
   3 June
   23:32:09
   UTC+8
   After reaching the target:
   Automatically moves to the next year.
========================================================= */
const TARGET_MONTH = 5;       // June = 5
const TARGET_DAY = 3;
const TARGET_HOUR = 23;
const TARGET_MINUTE = 32;
const TARGET_SECOND = 9;
const UTC_OFFSET_HOURS = 8;
const elements = {
    years: document.getElementById("years"),
    months: document.getElementById("months"),
    days: document.getElementById("days"),
    hours: document.getElementById("hours"),
    minutes: document.getElementById("minutes"),
    seconds: document.getElementById("seconds")
};
const pyramid = document.getElementById("pyramid");
const countdown = document.getElementById("countdown");
const lightning = document.querySelector(".lightning");
let currentTargetYear = null;
let previousValues = {
    years:null,
    months:null,
    days:null,
    hours:null,
    minutes:null,
    seconds:null
};
/* =========================================================
   CREATE TARGET TIMESTAMP
========================================================= */
function createTargetTimestamp(year){
    /*
        Singapore/Malaysia:
        3 June YYYY
        23:32:09 UTC+8
        Convert to UTC:
        15:32:09 UTC
    */
    return Date.UTC(
        year,
        TARGET_MONTH,
        TARGET_DAY,
        TARGET_HOUR - UTC_OFFSET_HOURS,
        TARGET_MINUTE,
        TARGET_SECOND
    );
}
/* =========================================================
   GET CURRENT SINGAPORE YEAR
========================================================= */
function getSingaporeDate(){
    const now = Date.now();
    return new Date(
        now + (UTC_OFFSET_HOURS * 60 * 60 * 1000)
    );
}
/* =========================================================
   GET NEXT TARGET
========================================================= */
function getNextTarget(){
    const singaporeNow = getSingaporeDate();
    let year = singaporeNow.getUTCFullYear();
    let target = createTargetTimestamp(year);
    if(Date.now() >= target){
        year++;
        target = createTargetTimestamp(year);
    }
    return {
        year,
        timestamp:target
    };
}
/* =========================================================
   CALENDAR DIFFERENCE
========================================================= */
function calculateDifference(nowTimestamp,targetTimestamp){
    /*
        Shift both timestamps into Singapore calendar time.
        This keeps the calendar calculation independent
        from the device's own timezone.
    */
    const offsetMs =
        UTC_OFFSET_HOURS * 60 * 60 * 1000;
    const nowSG =
        new Date(nowTimestamp + offsetMs);
    const targetSG =
        new Date(targetTimestamp + offsetMs);
    let years =
        targetSG.getUTCFullYear() -
        nowSG.getUTCFullYear();
    let cursor =
        new Date(
            Date.UTC(
                nowSG.getUTCFullYear(),
                nowSG.getUTCMonth(),
                nowSG.getUTCDate(),
                nowSG.getUTCHours(),
                nowSG.getUTCMinutes(),
                nowSG.getUTCSeconds(),
                nowSG.getUTCMilliseconds()
            )
        );
    let targetCalendar =
        new Date(
            Date.UTC(
                targetSG.getUTCFullYear(),
                targetSG.getUTCMonth(),
                targetSG.getUTCDate(),
                targetSG.getUTCHours(),
                targetSG.getUTCMinutes(),
                targetSG.getUTCSeconds(),
                targetSG.getUTCMilliseconds()
            )
        );
    if(years > 0){
        const test =
            new Date(cursor);
        test.setUTCFullYear(
            test.getUTCFullYear() + years
        );
        if(test > targetCalendar){
            years--;
        }
    }
    cursor.setUTCFullYear(
        cursor.getUTCFullYear() + years
    );
    let months =
        targetCalendar.getUTCMonth() -
        cursor.getUTCMonth();
    if(months < 0){
        months += 12;
    }
    let monthCursor =
        new Date(cursor);
    monthCursor.setUTCMonth(
        monthCursor.getUTCMonth() + months
    );
    if(monthCursor > targetCalendar){
        months--;
        monthCursor =
            new Date(cursor);
        monthCursor.setUTCMonth(
            monthCursor.getUTCMonth() + months
        );
    }
    let remaining =
        targetCalendar.getTime() -
        monthCursor.getTime();
    const dayMs =
        24 * 60 * 60 * 1000;
    const hourMs =
        60 * 60 * 1000;
    const minuteMs =
        60 * 1000;
    const secondMs = 1000;
    const days =
        Math.floor(remaining / dayMs);
    remaining -= days * dayMs;

        Math.floor(remaining / hourMs);

    const minutes =
        Math.floor(remaining / minuteMs);

    const seconds =
        Math.floor(remaining / secondMs);
    return {
        years,
        months,
        days,
        hours,
        minutes,
        seconds
    };
}

<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Masta Xul</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f2ef;
      color: #111;
      padding: 20px 16px 60px;
    }
    .box {
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      border: 2px solid #6B4423;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 4px 16px rgba(107,68,35,0.1);
    }
    h1 { font-size: 1.35rem; margin-bottom: 4px; text-align: center; }
    .sub { text-align: center; color: #6B4423; font-size: 0.9rem; margin-bottom: 22px; }
    label { display: block; font-weight: 600; font-size: 0.88rem; margin: 14px 0 6px; }
    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #6B4423;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      background: #fff;
    }
    input:focus, textarea:focus { border-color: #D32F2F; }
    textarea { min-height: 90px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button[type="submit"] {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #D32F2F;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
    button[type="submit"]:disabled { background: #ccc; cursor: not-allowed; }
    button[type="submit"]:hover:not(:disabled) { background: #111; }
    .msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      display: none;
      text-align: center;
    }
    .msg.ok { display: block; background: #e8f5e9; color: #2E7D32; }
    .msg.err { display: block; background: #ffebee; color: #c62828; }
    .hint { font-size: 0.8rem; color: #888; margin-top: 4px; }
    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #6B4423;
      font-weight: 600;
      text-decoration: none;
    }
    .upload-box {
      border: 2px dashed #6B4423;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      background: #faf7f4;
    }
    .upload-box input[type="file"] {
      border: none;
      padding: 8px 0;
    }
    .preview {
      margin-top: 12px;
      max-width: 100%;
      max-height: 200px;
      border-radius: 10px;
      display: none;
      object-fit: contain;
      background: #f0ebe6;
    }
    .upload-status {
      font-size: 0.85rem;
      margin-top: 8px;
      color: #6B4423;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Dashboard Admin</h1>
    <p class="sub">Tambah produk · Upload gambar ImgBB</p>

    <form id="formProduk">
      <label>Password admin *</label>
      <input type="password" id="password" required placeholder="Password">

      <label>ID (kosongkan = auto)</label>
      <input type="text" id="id" placeholder="Contoh: 31">

      <label>Nama produk *</label>
      <input type="text" id="nama" required placeholder="Nama produk">

      <div class="row">
        <div>
          <label>Harga *</label>
          <input type="text" id="harga" required placeholder="89.90">
        </div>
        <div>
          <label>Terjual</label>
          <input type="text" id="terjual" placeholder="120">
        </div>
      </div>

      <label>Kategori</label>
      <input type="text" id="kategori" placeholder="Rumah, Elektrik">
      <p class="hint">Boleh lebih dari satu, asingkan dengan koma</p>

      <label>Badge</label>
      <input type="text" id="badge" placeholder="Hot / Viral">

      <label>Gambar produk</label>
      <div class="upload-box">
        <input type="file" id="fileGambar" accept="image/*">
        <p class="hint">Pilih gambar → auto upload ke ImgBB</p>
        <p class="upload-status" id="uploadStatus"></p>
        <img id="preview" class="preview" alt="Preview">
      </div>

      <label>Link gambar (auto / manual)</label>
      <input type="url" id="gambar" placeholder="Akan diisi automatik selepas upload">

      <label>Link TikTok</label>
      <input type="url" id="tiktok" placeholder="https://...">

      <label>Link Shopee</label>
      <input type="url" id="shopee" placeholder="https://...">

      <label>Link Lazada</label>
      <input type="url" id="lazada" placeholder="https://...">

      <label>Deskripsi</label>
      <textarea id="deskripsi" placeholder="Penerangan produk..."></textarea>

      <button type="submit" id="btnSubmit">Tambah Produk</button>
    </form>

    <div class="msg" id="msg"></div>
    <a class="back" href="/shop/">← Ke Shop</a>
  </div>

  <script>
    const IMGBB_API_KEY = "2f15c5f61169e03e49246930bcecbfc8";
    const API_URL = "https://script.google.com/macros/s/AKfycbx5tijI4QHYTNap-YEN5i9-ZGfDIZ1IcGqUsZNi32s9gtOT9sIV0GcsUPzPka4srYujRA/exec";

    const form = document.getElementById("formProduk");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btnSubmit");
    const fileInput = document.getElementById("fileGambar");
    const preview = document.getElementById("preview");
    const uploadStatus = document.getElementById("uploadStatus");
    const gambarInput = document.getElementById("gambar");

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      const localURL = URL.createObjectURL(file);
      preview.src = localURL;
      preview.style.display = "block";

      uploadStatus.textContent = "⏳ Sedang upload ke ImgBB...";
      btn.disabled = true;

      try {
        const formData = new FormData();
        formData.append("image", file);

        const res = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (data.success && data.data && data.data.url) {
          gambarInput.value = data.data.url;
          uploadStatus.textContent = "✅ Upload berjaya";
        } else {
          uploadStatus.textContent = "❌ Upload gagal. Cuba lagi / paste link manual.";
          console.log(data);
        }
      } catch (err) {
        console.error(err);
        uploadStatus.textContent = "❌ Ralat upload. Paste link manual jika perlu.";
      }

      btn.disabled = false;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";
      msg.textContent = "";
      btn.disabled = true;
      btn.textContent = "Menghantar...";

      const payload = {
        password: document.getElementById("password").value.trim(),
        id: document.getElementById("id").value.trim(),
        nama: document.getElementById("nama").value.trim(),
        harga: document.getElementById("harga").value.trim(),
        terjual: document.getElementById("terjual").value.trim(),
        kategori: document.getElementById("kategori").value.trim(),
        badge: document.getElementById("badge").value.trim(),
        gambar: document.getElementById("gambar").value.trim(),
        tiktok: document.getElementById("tiktok").value.trim(),
        shopee: document.getElementById("shopee").value.trim(),
        lazada: document.getElementById("lazada").value.trim(),
        deskripsi: document.getElementById("deskripsi").value.trim()
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.ok) {
          msg.className = "msg ok";
          msg.textContent = "✅ " + data.message + " (ID: " + data.id + ")";
          form.reset();
          preview.style.display = "none";
          uploadStatus.textContent = "";
        } else {
          msg.className = "msg err";
          msg.textContent = "❌ " + (data.message || "Gagal");
        }
      } catch (err) {
        msg.className = "msg ok";
        msg.textContent = "✅ Dihantar. Sila semak sheet PRODUK.";
        form.reset();
        preview.style.display = "none";
        uploadStatus.textContent = "";
      }

      btn.disabled = false;
      btn.textContent = "Tambah Produk";
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Masta Xul</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f2ef;
      color: #111;
      padding: 20px 16px 60px;
    }
    .box {
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      border: 2px solid #6B4423;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 4px 16px rgba(107,68,35,0.1);
    }
    h1 { font-size: 1.35rem; margin-bottom: 4px; text-align: center; }
    .sub { text-align: center; color: #6B4423; font-size: 0.9rem; margin-bottom: 22px; }
    label { display: block; font-weight: 600; font-size: 0.88rem; margin: 14px 0 6px; }
    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #6B4423;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      background: #fff;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { border-color: #D32F2F; }
    textarea { min-height: 90px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button[type="submit"] {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #D32F2F;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
    button[type="submit"]:disabled { background: #ccc; cursor: not-allowed; }
    button[type="submit"]:hover:not(:disabled) { background: #111; }
    .msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      display: none;
      text-align: center;
    }
    .msg.ok { display: block; background: #e8f5e9; color: #2E7D32; }
    .msg.err { display: block; background: #ffebee; color: #c62828; }
    .msg.warn { display: block; background: #fff8e1; color: #8a6100; }
    .hint { font-size: 0.8rem; color: #888; margin-top: 4px; }
    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #6B4423;
      font-weight: 600;
      text-decoration: none;
    }
    .upload-box {
      border: 2px dashed #6B4423;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      background: #faf7f4;
    }
    .upload-box input[type="file"] {
      border: none;
      padding: 8px 0;
    }
    .preview {
      margin-top: 12px;
      max-width: 100%;
      max-height: 200px;
      border-radius: 10px;
      display: none;
      object-fit: contain;
      background: #f0ebe6;
    }
    .upload-status {
      font-size: 0.85rem;
      margin-top: 8px;
      color: #6B4423;
    }
    .ocr-status {
      font-size: 0.85rem;
      margin-top: 6px;
      color: #0088cc;
      font-weight: 600;
    }
    .checkbox-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .chk {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 2px solid #6B4423;
      border-radius: 20px;
      padding: 7px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      background: #fff;
      margin: 0;
    }
    .chk input {
      width: auto;
      margin: 0;
      accent-color: #D32F2F;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

  <div class="box">
    <h1>Dashboard Admin</h1>
    <p class="sub">Tambah produk · Upload gambar ImgBB</p>

    <form id="formProduk">
      <label>Gambar produk</label>
      <div class="upload-box">
        <input type="file" id="fileGambar" accept="image/*">
        <p class="hint">Pilih gambar → auto upload ke ImgBB + baca teks (OCR) untuk cadangan nama/badge/deskripsi</p>
        <p class="upload-status" id="uploadStatus"></p>
        <p class="ocr-status" id="ocrStatus"></p>
        <img id="preview" class="preview" alt="Preview">
      </div>

      <label>Link gambar (auto / manual)</label>
      <input type="url" id="gambar" placeholder="Akan diisi automatik selepas upload">

      <label>Password admin *</label>
      <input type="password" id="password" required placeholder="Password" autocomplete="off">

      <label>ID (kosongkan = auto)</label>
      <input type="text" id="id" placeholder="Contoh: 31">

      <label>Nama produk *</label>
      <input type="text" id="nama" required placeholder="Nama produk (atau biar OCR cadangkan)">

      <div class="row">
        <div>
          <label>Harga *</label>
          <input type="text" id="harga" required placeholder="89.90">
        </div>
        <div>
          <label>Terjual</label>
          <input type="text" id="terjual" placeholder="120">
        </div>
      </div>

      <label>Kategori</label>
      <div class="checkbox-grid" id="kategoriGrid">
        <label class="chk"><input type="checkbox" value="Viral"> Viral</label>
        <label class="chk"><input type="checkbox" value="Kesihatan"> Kesihatan</label>
        <label class="chk"><input type="checkbox" value="Gadget"> Gadget</label>
        <label class="chk"><input type="checkbox" value="Rumah"> Rumah</label>
        <label class="chk"><input type="checkbox" value="Kecantikan"> Kecantikan</label>
        <label class="chk"><input type="checkbox" value="Pertanian"> Pertanian</label>
        <label class="chk"><input type="checkbox" value="Dapur"> Dapur</label>
        <label class="chk"><input type="checkbox" value="Lelaki"> Lelaki</label>
        <label class="chk"><input type="checkbox" value="Wanita"> Wanita</label>
        <label class="chk"><input type="checkbox" value="Sukan"> Sukan</label>
        <label class="chk"><input type="checkbox" value="Elektrik"> Elektrik</label>
        <label class="chk"><input type="checkbox" value="Tumbuhan"> Tumbuhan</label>
      </div>
      <input type="text" id="kategoriLain" placeholder="Kategori lain (pisah dengan koma)" style="margin-top:10px;">
      <p class="hint">Tanda mana-mana berkaitan. Kategori yang tiada dalam senarai boleh taip kat ruang atas (pisah dengan koma).</p>

      <label>Badge</label>
      <select id="badge">
        <option value="">Tiada</option>
        <option value="Hot">Hot</option>
        <option value="Viral">Viral</option>
        <option value="Terlaris">Terlaris</option>
        <option value="Mantap">Mantap</option>
        <option value="__lain__">Lain (taip sendiri)</option>
      </select>
      <input type="text" id="badgeLain" placeholder="Taip badge baru" style="display:none; margin-top:8px;">

      <label>Link TikTok</label>
      <input type="url" id="tiktok" placeholder="https://...">

      <label>Link Shopee</label>
      <input type="url" id="shopee" placeholder="https://...">

      <label>Link Lazada</label>
      <input type="url" id="lazada" placeholder="https://...">

      <label>Deskripsi</label>
      <textarea id="deskripsi" placeholder="Penerangan produk... (atau biar OCR cadangkan draf)"></textarea>

      <button type="submit" id="btnSubmit">Tambah Produk</button>
    </form>

    <div class="msg" id="msg"></div>
    <a class="back" href="/shop/">← Ke Shop</a>
  </div>

  <script>
    const IMGBB_API_KEY = "2f15c5f61169e03e49246930bcecbfc8";
    const API_URL = "https://script.google.com/macros/s/AKfycbx5tijI4QHYTNap-YEN5i9-ZGfDIZ1IcGqUsZNi32s9gtOT9sIV0GcsUPzPka4srYujRA/exec";

    const form = document.getElementById("formProduk");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btnSubmit");
    const fileInput = document.getElementById("fileGambar");
    const preview = document.getElementById("preview");
    const uploadStatus = document.getElementById("uploadStatus");
    const gambarInput = document.getElementById("gambar");
    const badgeSelect = document.getElementById("badge");
    const badgeLain = document.getElementById("badgeLain");
    const ocrStatus = document.getElementById("ocrStatus");
    const namaInput = document.getElementById("nama");
    const deskripsiInput = document.getElementById("deskripsi");

    // Tunjuk/sorok ruang "taip sendiri" ikut pilihan badge
    badgeSelect.addEventListener("change", () => {
      badgeLain.style.display = badgeSelect.value === "__lain__" ? "block" : "none";
      if (badgeSelect.value === "__lain__") badgeLain.focus();
    });

    // ===== OCR: baca teks dari gambar, cadangkan nama/badge/deskripsi =====
    // Heuristik ringkas: baris dengan font PALING BESAR dianggap nama produk
    // (biasa nama/brand ditulis paling besar pada kotak). Baki teks jadi draf
    // deskripsi. Cari kata kunci untuk cadangan badge. Kategori TIDAK cuba
    // diteka — kotak produk jarang tulis terus nama kategori e-commerce.
    async function jalankanOCR(file) {
      ocrStatus.textContent = "🔍 Membaca teks dari gambar (OCR)... mungkin ambil beberapa saat";
      try {
        const worker = await Tesseract.createWorker("eng+msa");
        const { data } = await worker.recognize(file);
        await worker.terminate();

        const baris = (data.lines || [])
          .map(l => ({ text: (l.text || "").trim(), height: l.bbox ? (l.bbox.y1 - l.bbox.y0) : 0 }))
          .filter(l => l.text.length > 1);

        if (baris.length === 0) {
          ocrStatus.textContent = "ℹ️ Tiada teks dikesan dalam gambar — sila isi manual.";
          return;
        }

        // Baris paling besar = cadangan nama produk
        const barisTerbesar = baris.reduce((a, b) => (b.height > a.height ? b : a));

        // Isi nama HANYA kalau field masih kosong (elak overwrite apa yang admin dah taip)
        if (!namaInput.value.trim()) {
          namaInput.value = barisTerbesar.text;
        }

        // Baki baris jadi draf deskripsi
        const bakiText = baris
          .filter(l => l !== barisTerbesar)
          .map(l => l.text)
          .join("\n");
        if (!deskripsiInput.value.trim() && bakiText) {
          deskripsiInput.value = bakiText;
        }

        // Cari kata kunci badge
        const semuaText = baris.map(l => l.text).join(" ").toLowerCase();
        const petaBadge = [
          ["viral", "Viral"],
          ["best seller", "Terlaris"],
          ["terlaris", "Terlaris"],
          ["hot", "Hot"],
          ["mantap", "Mantap"]
        ];
        if (!badgeSelect.value) {
          for (const [kw, val] of petaBadge) {
            if (semuaText.includes(kw)) {
              badgeSelect.value = val;
              break;
            }
          }
        }

        ocrStatus.textContent = "✅ OCR siap — sila semak & edit cadangan nama/deskripsi/badge sebelum hantar.";
      } catch (err) {
        console.error("OCR gagal:", err);
        ocrStatus.textContent = "⚠️ OCR gagal jalan — sila isi nama/deskripsi/badge manual.";
      }
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      const localURL = URL.createObjectURL(file);
      preview.src = localURL;
      preview.style.display = "block";

      uploadStatus.textContent = "⏳ Sedang upload ke ImgBB...";
      ocrStatus.textContent = "";
      btn.disabled = true;

      // Upload ImgBB dan OCR jalan SERENTAK (tak tunggu satu sama lain)
      const uploadPromise = (async () => {
        try {
          const formData = new FormData();
          formData.append("image", file);

          const res = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, {
            method: "POST",
            body: formData
          });

          const data = await res.json();

          if (data.success && data.data && data.data.url) {
            gambarInput.value = data.data.url;
            uploadStatus.textContent = "✅ Upload berjaya";
          } else {
            uploadStatus.textContent = "❌ Upload gagal. Cuba lagi / paste link manual.";
            console.log(data);
          }
        } catch (err) {
          console.error(err);
          uploadStatus.textContent = "❌ Ralat upload. Paste link manual jika perlu.";
        }
      })();

      const ocrPromise = jalankanOCR(file);

      await Promise.all([uploadPromise, ocrPromise]);
      btn.disabled = false;
    });

    function ambilKategoriGabungan() {
      const dipilih = Array.from(
        document.querySelectorAll('#kategoriGrid input[type="checkbox"]:checked')
      ).map(c => c.value);

      const lain = document.getElementById("kategoriLain").value.trim();
      if (lain) {
        lain.split(",").map(s => s.trim()).filter(Boolean).forEach(k => {
          if (!dipilih.includes(k)) dipilih.push(k);
        });
      }
      return dipilih.join(", ");
    }

    function ambilBadge() {
      if (badgeSelect.value === "__lain__") return badgeLain.value.trim();
      return badgeSelect.value;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";
      msg.textContent = "";
      btn.disabled = true;
      btn.textContent = "Menghantar...";

      const payload = {
        password: document.getElementById("password").value.trim(),
        id: document.getElementById("id").value.trim(),
        nama: document.getElementById("nama").value.trim(),
        harga: document.getElementById("harga").value.trim(),
        terjual: document.getElementById("terjual").value.trim(),
        kategori: ambilKategoriGabungan(),
        badge: ambilBadge(),
        gambar: document.getElementById("gambar").value.trim(),
        tiktok: document.getElementById("tiktok").value.trim(),
        shopee: document.getElementById("shopee").value.trim(),
        lazada: document.getElementById("lazada").value.trim(),
        deskripsi: document.getElementById("deskripsi").value.trim()
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.ok) {
          msg.className = "msg ok";
          msg.textContent = "✅ " + data.message + " (ID: " + data.id + ") — menyegerak cache...";
          form.reset();
          preview.style.display = "none";
          uploadStatus.textContent = "";
          ocrStatus.textContent = "";
          badgeLain.style.display = "none";

          // Auto-sync ke Cloudflare KV supaya produk terus muncul tanpa tunggu cron 10 minit
          try {
            await fetch("/api/produk/refresh");
            msg.textContent = "✅ " + data.message + " (ID: " + data.id + ") — cache disegerak, boleh terus share!";
          } catch (refreshErr) {
            console.error("Refresh cache gagal:", refreshErr);
            msg.textContent = "✅ " + data.message + " (ID: " + data.id + ") — tapi cache gagal disegerak automatik, produk akan muncul dalam ~10 minit.";
          }
        } else {
          msg.className = "msg err";
          msg.textContent = "❌ " + (data.message || "Gagal");
        }
      } catch (err) {
        // Tak dapat baca respons (contoh: isu rangkaian/CORS) — TAK bermakna
        // semestinya gagal, tapi kita juga tak boleh confirm ia berjaya.
        // Borang SENGAJA tidak di-reset supaya data tak hilang kalau perlu hantar semula.
        console.error(err);
        msg.className = "msg warn";
        msg.textContent = "⚠️ Tidak dapat sahkan status penghantaran. Sila semak sheet PRODUK — kalau produk belum masuk, cuba hantar semula.";
      }

      btn.disabled = false;
      btn.textContent = "Tambah Produk";
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | mastaxul.my</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .logo span {
      color: #38bdf8;
    }

    .logo p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #f1f5f9;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgb(56 189 248 / 0.15);
    }

    button {
      width: 100%;
      padding: 0.85rem;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    button:hover {
      background: #0284c7;
    }

    .error {
      background: #7f1d1d;
      color: #fecaca;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
      text-align: center;
    }

    .success-box {
      display: none;
      text-align: center;
    }

    .success-box h2 {
      color: #4ade80;
      margin-bottom: 0.75rem;
    }

    .success-box p {
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }

    .logout-btn {
      background: #ef4444;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    .info {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- LOGIN FORM -->
  <div class="card" id="loginCard">
    <div class="logo">
      <h1>mastax<span>ul</span>.my</h1>
      <p>Simulasi Login</p>
    </div>

    <div class="error" id="errorMsg">Username atau password salah</div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          placeholder="Masukkan username" 
          required 
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        />
      </div>

      <button type="submit">Log Masuk</button>
    </form>

    <div class="info">
      Username: <strong>admin</strong> | Password: <strong>276669</strong>
    </div>
  </div>

  <!-- DASHBOARD SELEPAS LOGIN BERJAYA -->
  <div class="card success-box" id="dashboard">
    <div class="logo">
      <h1>mastax<span>ul</span>.my</h1>
    </div>
    <h2>Login Berjaya!</h2>
    <p>Selamat datang, <strong>Admin</strong></p>
    <p style="font-size: 0.9rem; color: #64748b;">
      Ini adalah simulasi dashboard.<br>
      Email domain: @mastaxul.my
    </p>
    <button class="logout-btn" onclick="logout()">Log Keluar</button>
  </div>

  <script>
    // Data login simulasi
    const VALID_USER = "admin";
    const VALID_PASS = "276669";

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      // Semak login
      if (username === VALID_USER && password === VALID_PASS) {
        // Berjaya
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        errorMsg.style.display = 'none';
      } else {
        // Gagal
        errorMsg.style.display = 'block';
        document.getElementById('password').value = '';
      }
    });

    function logout() {
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('errorMsg').style.display = 'none';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubungi Kami | Masta Xul Affiliate Shop</title>
  <meta name="description" content="Hubungi Masta Xul Affiliate Shop. Hantar pertanyaan, cadangan atau kerjasama melalui borang ini.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://mastaxul.my/hubungi/">
  <link rel="stylesheet" href="../style.css">
  <style>
    .contact-wrap {
      max-width: 520px;
      margin: 30px auto 60px;
      padding: 0 16px;
    }
    .contact-wrap h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #111;
    }
    .contact-sub {
      text-align: center;
      color: #6B4423;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    .contact-form {
      background: #fff;
      border: 2px solid #6B4423;
      border-radius: 14px;
      padding: 24px 20px;
    }
    .contact-form label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #111;
    }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #6B4423;
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
      background: #fff;
      color: #111;
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: #D32F2F;
    }
    .contact-form textarea {
      min-height: 120px;
      resize: vertical;
    }
    .captcha-box {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .captcha-q {
      background: #111;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 1px;
    }
    .captcha-box input {
      width: 100px;
      margin-bottom: 0;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #D32F2F;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-submit:hover {
      background: #111;
    }
    .btn-submit:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .form-msg {
      text-align: center;
      margin-top: 14px;
      font-weight: 600;
      font-size: 0.95rem;
      display: none;
    }
    .form-msg.ok { color: #2E7D32; display: block; }
    .form-msg.err { color: #D32F2F; display: block; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #6B4423;
      font-weight: 600;
      text-decoration: none;
    }
    .back-link:hover { color: #D32F2F; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <img src="https://i.ibb.co/SwpWGqrs/IMG-0606.png" class="logo" alt="Logo">
    <!-- Butang hamburger ditambah oleh menu.js -->
  </div>
  <h1>Masta Xul Affiliate Shop</h1>
  <p>Hubungi Kami</p>
</header>

<div class="contact-wrap">
  <h1>Hubungi Kami</h1>
  <p class="contact-sub">Pertanyaan, cadangan atau kerjasama — isi borang di bawah.</p>

  <form class="contact-form" id="contactForm">
    <label for="nama">Nama</label>
    <input type="text" id="nama" name="nama" required maxlength="80" placeholder="Nama anda" autocomplete="name">

    <label for="email">E-mel / Telefon</label>
    <input type="text" id="email" name="email" required maxlength="100" placeholder="Emel atau nombor telefon" autocomplete="email">

    <label for="mesej">Mesej</label>
    <textarea id="mesej" name="mesej" required maxlength="2000" placeholder="Tulis mesej anda di sini..."></textarea>

    <label>Captcha</label>
    <div class="captcha-box">
      <span class="captcha-q" id="captchaQ">?</span>
      <input type="number" id="captchaA" required placeholder="Jawapan" inputmode="numeric">
    </div>

    <button type="submit" class="btn-submit" id="btnSubmit">Hantar Mesej</button>
    <p class="form-msg" id="formMsg"></p>
  </form>

  <a href="/" class="back-link">← Kembali ke Laman Utama</a>
</div>

<footer>
  © 2026 Masta Xul Affiliate Shop
</footer>

<script src="../menu.js"></script>
<script>
  // ========== APPS SCRIPT WEB APP ==========
  const FORM_API = "https://script.google.com/macros/s/AKfycbxsWSCyKSOiEx-Syg1dGuNT21U0Qqv_4GPBiFhJgvU-t014SXvbOwKAWL4TZiQk8NJE/exec";

  let captchaJawapan = 0;

  function buatCaptcha() {
    const a = Math.floor(Math.random() * 9) + 1;
    const b = Math.floor(Math.random() * 9) + 1;
    captchaJawapan = a + b;
    document.getElementById("captchaQ").textContent = a + " + " + b + " = ?";
    document.getElementById("captchaA").value = "";
  }

  buatCaptcha();

  document.getElementById("contactForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const msg = document.getElementById("formMsg");
    const btn = document.getElementById("btnSubmit");
    msg.className = "form-msg";
    msg.textContent = "";

    const jawapan = parseInt(document.getElementById("captchaA").value, 10);
    if (jawapan !== captchaJawapan) {
      msg.textContent = "Captcha salah. Sila cuba lagi.";
      msg.className = "form-msg err";
      buatCaptcha();
      return;
    }

    const nama = document.getElementById("nama").value.trim();
    const email = document.getElementById("email").value.trim();
    const mesej = document.getElementById("mesej").value.trim();

    if (!nama || !email || !mesej) {
      msg.textContent = "Sila isi semua ruangan.";
      msg.className = "form-msg err";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Menghantar...";

    try {
      // text/plain elak preflight CORS dengan Apps Script
      const res = await fetch(FORM_API, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ nama, email, mesej })
      });

      // Apps Script sering return redirect; anggap berjaya jika tiada network error
      msg.textContent = "Mesej berjaya dihantar. Terima kasih!";
      msg.className = "form-msg ok";
      document.getElementById("contactForm").reset();
      buatCaptcha();
    } catch (err) {
      console.error(err);
      msg.textContent = "Gagal menghantar. Sila cuba lagi atau hubungi melalui WhatsApp Channel.";
      msg.className = "form-msg err";
      buatCaptcha();
    } finally {
      btn.disabled = false;
      btn.textContent = "Hantar Mesej";
    }
  });
</script>
</body>
</html>

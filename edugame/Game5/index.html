<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Jom Belajar! 🌈</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
    background: linear-gradient(135deg, #dff7ff, #fff5d9);
    color: #263238;
    min-height: 100vh;
}

/* =========================
   HEADER
========================= */

header {
    background: linear-gradient(135deg, #6c63ff, #8e7dff);
    color: white;
    text-align: center;
    padding: 18px 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,.15);
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 6px 0 0;
    font-size: 15px;
}

/* =========================
   CONTAINER
========================= */

.container {
    width: min(700px, 94%);
    margin: 20px auto;
}

/* =========================
   CARD
========================= */

.card {
    background: white;
    border-radius: 25px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

/* =========================
   START SCREEN
========================= */

.start-screen {
    text-align: center;
}

.logo {
    font-size: 75px;
    margin-bottom: 5px;
}

.start-screen h2 {
    color: #5b50d6;
    font-size: 27px;
}

label {
    display: block;
    text-align: left;
    margin-top: 15px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 15px;
    margin-top: 7px;
    border-radius: 15px;
    border: 2px solid #ddd;
    font-size: 18px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #6c63ff;
}

/* =========================
   BUTTON
========================= */

.btn {
    width: 100%;
    border: 0;
    padding: 16px;
    border-radius: 18px;
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(135deg, #6c63ff, #8e7dff);
    color: white;
    box-shadow: 0 5px 12px rgba(108,99,255,.35);
}

.btn:active {
    transform: scale(.97);
}

/* =========================
   GAME HEADER
========================= */

.game-info {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.info-box {
    flex: 1;
    min-width: 120px;
    background: #f5f4ff;
    padding: 12px;
    border-radius: 15px;
    text-align: center;
    font-weight: bold;
}

.stars {
    color: #ffb300;
    font-size: 21px;
}

/* =========================
   QUESTION
========================= */

.question-card {
    text-align: center;
}

.question-number {
    color: #777;
    font-size: 15px;
}

.question {
    font-size: 26px;
    font-weight: bold;
    margin: 20px 0;
}

.big-letter {
    font-size: 90px;
    font-weight: bold;
    color: #6c63ff;
}

/* =========================
   OPTIONS
========================= */

.options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.option {
    background: #f5f5ff;
    border: 3px solid transparent;
    border-radius: 20px;
    padding: 20px;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
    min-height: 75px;
}

.option:hover {
    border-color: #6c63ff;
}

.option.correct {
    background: #d9ffd9;
    border-color: #32a852;
}

.option.wrong {
    background: #ffdede;
    border-color: #e53935;
}

/* =========================
   DRAG DROP
========================= */

.drag-area {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.drag-item,
.drop-zone {
    width: 100px;
    height: 100px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
    font-weight: bold;
}

.drag-item {
    background: #ffe082;
    cursor: grab;
}

.drop-zone {
    background: #e3f2fd;
    border: 4px dashed #64b5f6;
}

/* =========================
   MATCHING
========================= */

.match-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.match-item {
    padding: 18px;
    background: #f5f5ff;
    border-radius: 18px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    border: 3px solid transparent;
}

.match-item.selected {
    border-color: #6c63ff;
}

.match-item.matched {
    background: #d9ffd9;
    border-color: #32a852;
}

/* =========================
   FIREWORK
========================= */

#fireworks {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
}

.spark {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: explode 900ms ease-out forwards;
}

@keyframes explode {
    from {
        transform: translate(0,0) scale(1);
        opacity: 1;
    }

    to {
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(.2);
        opacity: 0;
    }
}

/* =========================
   FEEDBACK
========================= */

.feedback {
    font-size: 24px;
    font-weight: bold;
    margin-top: 20px;
    min-height: 30px;
}

.correct-text {
    color: #2e9d45;
}

.wrong-text {
    color: #e53935;
}

/* =========================
   RESULT
========================= */

.result {
    text-align: center;
}

.result-stars {
    font-size: 50px;
    color: #ffb300;
}

.result-score {
    font-size: 35px;
    font-weight: bold;
    color: #5b50d6;
}

/* =========================
   HIDDEN
========================= */

.hidden {
    display: none !important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px) {

    header h1 {
        font-size: 23px;
    }

    .question {
        font-size: 22px;
    }

    .options {
        grid-template-columns: 1fr 1fr;
    }

    .option {
        font-size: 22px;
    }

    .big-letter {
        font-size: 75px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🌈 Jom Belajar!</h1>
    <p>Rumi • Jawi • Nombor</p>
</header>

<div class="container">

<!-- =========================
     START SCREEN
========================= -->

<div id="startScreen" class="card start-screen">

    <div class="logo">🧒📚</div>

    <h2>Selamat Datang!</h2>

    <p>
        Mari belajar huruf Rumi, Jawi dan nombor
        sambil bermain 🎉
    </p>

    <label>Nama Murid</label>

    <input
        type="text"
        id="studentName"
        placeholder="Contoh: Ali"
        maxlength="30"
    >

    <label>Masa Bermain</label>

    <select id="gameTime">
        <option value="5">5 minit</option>
        <option value="10">10 minit</option>
        <option value="15" selected>15 minit</option>
        <option value="30">30 minit</option>
        <option value="60">60 minit</option>
    </select>

    <label>Topik</label>

    <select id="category">

        <option value="semua">
            Semua Topik
        </option>

        <option value="rumi">
            🔤 Huruf Rumi
        </option>

        <option value="jawi">
            🕌 Huruf Jawi
        </option>

        <option value="nombor">
            🔢 Nombor
        </option>

    </select>

    <button
        class="btn"
        onclick="startGame()"
    >
        🚀 MULA BERMAIN
    </button>

</div>


<!-- =========================
     GAME SCREEN
========================= -->

<div id="gameScreen" class="hidden">

    <div class="game-info">

        <div class="info-box">
            👧
            <br>
            <span id="playerName"></span>
        </div>

        <div class="info-box">
            ⭐
            <br>
            <span id="score">0</span>
        </div>

        <div class="info-box">
            ⏱️
            <br>
            <span id="timer">15:00</span>
        </div>

    </div>


    <div class="card question-card">

        <div class="question-number">
            Soalan <span id="questionNumber">1</span>
        </div>

        <div
            id="questionArea"
            class="question"
        ></div>

        <div
            id="feedback"
            class="feedback"
        ></div>

    </div>

</div>


<!-- =========================
     RESULT
========================= -->

<div id="resultScreen"
     class="card result hidden">

    <div style="font-size:70px;">
        🏆
    </div>

    <h2>Tahniah!</h2>

    <p>
        Hebat, <strong id="resultName"></strong>!
    </p>

    <div
        id="resultStars"
        class="result-stars"
    ></div>

    <div
        id="resultScore"
        class="result-score"
    ></div>

    <p>
        Teruskan belajar dan bermain! 🌈
    </p>

    <button
        class="btn"
        onclick="location.reload()"
    >
        🔄 MAIN SEMULA
    </button>

</div>

</div>


<!-- FIREWORK -->

<div id="fireworks"></div>


<script>

/* ==========================================================
   DATA SOALAN
========================================================== */

/*
   Ini ialah DATA DEMO V1.

   Dalam V2 kita akan masukkan
   sehingga 500 soalan sebenar.
*/

const questions = [

    /* =====================
       RUMI
    ===================== */

    {
        category: "rumi",
        type: "choice",
        question: "Huruf apakah ini?",
        display: "A",
        options: ["A","B","C","D"],
        answer: "A"
    },

    {
        category: "rumi",
        type: "choice",
        question: "Huruf apakah ini?",
        display: "B",
        options: ["A","B","C","D"],
        answer: "B"
    },

    {
        category: "rumi",
        type: "choice",
        question: "Huruf apakah ini?",
        display: "C",
        options: ["A","B","C","D"],
        answer: "C"
    },

    /* =====================
       JAWI
    ===================== */

    {
        category: "jawi",
        type: "choice",
        question: "Apakah huruf Jawi ini?",
        display: "ا",
        options: ["A","B","C","D"],
        answer: "A"
    },

    {
        category: "jawi",
        type: "choice",
        question: "Apakah huruf Jawi ini?",
        display: "ب",
        options: ["A","B","C","D"],
        answer: "B"
    },

    /* =====================
       NOMBOR
    ===================== */

    {
        category: "nombor",
        type: "choice",
        question: "Nombor apakah ini?",
        display: "3",
        options: ["1","2","3","4"],
        answer: "3"
    },

    {
        category: "nombor",
        type: "choice",
        question: "Nombor apakah ini?",
        display: "5",
        options: ["3","4","5","6"],
        answer: "5"
    },

    /* =====================
       ISI TEMPAT KOSONG
    ===================== */

    {
        category: "rumi",
        type: "fill",
        question: "Lengkapkan huruf: A, B, __",
        answer: "C"
    },

    /* =====================
       DRAG DROP
    ===================== */

    {
        category: "rumi",
        type: "drag",
        question: "Seret huruf A ke kotak.",
        drag: "A",
        answer: "A"
    },

    /* =====================
       PADANKAN
    ===================== */

    {
        category: "rumi",
        type: "match",
        question: "Padankan huruf dengan pasangannya.",
        pairs: [
            ["A","a"],
            ["B","b"],
            ["C","c"]
        ]
    }

];


/* ==========================================================
   GAME VARIABLES
========================================================== */

let currentQuestions = [];
let currentIndex = 0;

let score = 0;
let correctAnswers = 0;

let totalSeconds = 900;
let timerInterval;

let selectedMatch = null;


/* ==========================================================
   START GAME
========================================================== */

function startGame() {

    const name =
        document.getElementById("studentName")
        .value
        .trim();

    if (!name) {

        alert("Sila masukkan nama murid 😊");

        return;
    }


    const time =
        Number(
            document.getElementById("gameTime").value
        );


    const category =
        document.getElementById("category").value;


    document.getElementById("playerName")
        .textContent = name;


    totalSeconds =
        time * 60;


    let pool = questions;


    if (category !== "semua") {

        pool =
            questions.filter(
                q => q.category === category
            );

    }


    currentQuestions =
        [...pool]
        .sort(
            () => Math.random() - 0.5
        );


    currentIndex = 0;

    score = 0;

    correctAnswers = 0;


    document.getElementById("score")
        .textContent = score;


    document.getElementById("startScreen")
        .classList.add("hidden");


    document.getElementById("resultScreen")
        .classList.add("hidden");


    document.getElementById("gameScreen")
        .classList.remove("hidden");


    startTimer();

    showQuestion();

}


/* ==========================================================
   TIMER
========================================================== */

function startTimer() {

    clearInterval(timerInterval);

    updateTimer();

    timerInterval =
        setInterval(() => {

            totalSeconds--;

            updateTimer();


            if (totalSeconds <= 0) {

                clearInterval(timerInterval);

                finishGame();

            }

        },1000);
}


function updateTimer() {

    const minutes =
        Math.floor(totalSeconds / 60);

    const seconds =
        totalSeconds % 60;


    document.getElementById("timer")
        .textContent =
        String(minutes).padStart(2,"0")
        + ":"
        +
        String(seconds).padStart(2,"0");

}


/* ==========================================================
   SHOW QUESTION
========================================================== */

function showQuestion() {

    if (
        currentIndex >=
        currentQuestions.length
    ) {

        finishGame();

        return;
    }


    const q =
        currentQuestions[currentIndex];


    document.getElementById("questionNumber")
        .textContent =
        currentIndex + 1;


    document.getElementById("feedback")
        .textContent = "";


    const area =
        document.getElementById("questionArea");


    area.innerHTML = "";


    if (q.type === "choice") {

        showChoice(q, area);

    }

    else if (q.type === "fill") {

        showFill(q, area);

    }

    else if (q.type === "drag") {

        showDrag(q, area);

    }

    else if (q.type === "match") {

        showMatch(q, area);

    }

}


/* ==========================================================
   CHOICE
========================================================== */

function showChoice(q, area) {

    area.innerHTML = `

        <div>${q.question}</div>

        <div class="big-letter">
            ${q.display}
        </div>

        <div class="options">

            ${q.options.map(option => `

                <button
                    class="option"
                    onclick="answerChoice(this,'${escapeHTML(option)}','${escapeHTML(q.answer)}')"
                >
                    ${option}
                </button>

            `).join("")}

        </div>
    `;
}


function answerChoice(button,value,answer) {

    const buttons =
        document.querySelectorAll(".option");


    buttons.forEach(
        b => b.disabled = true
    );


    if (value === answer) {

        button.classList.add("correct");

        correct();

    }

    else {

        button.classList.add("wrong");

        wrong();

    }


    nextQuestion();

}


/* ==========================================================
   FILL
========================================================== */

function showFill(q,area) {

    area.innerHTML = `

        <div>${q.question}</div>

        <input
            id="fillAnswer"
            type="text"
            placeholder="Taip jawapan..."
            style="text-align:center;"
        >

        <button
            class="btn"
            onclick="checkFill('${escapeHTML(q.answer)}')"
        >
            ✓ JAWAB
        </button>

    `;
}


function checkFill(answer) {

    const input =
        document.getElementById("fillAnswer");


    const value =
        input.value.trim().toUpperCase();


    if (value === answer.toUpperCase()) {

        correct();

    }

    else {

        wrong();

    }


    input.disabled = true;

    nextQuestion();

}


/* ==========================================================
   DRAG
========================================================== */

function showDrag(q,area) {

    area.innerHTML = `

        <div>${q.question}</div>

        <div class="drag-area">

            <div
                class="drag-item"
                draggable="true"
                id="dragItem"
            >
                ${q.drag}
            </div>

            <div
                class="drop-zone"
                id="dropZone"
            >
                🎯
            </div>

        </div>

    `;


    const drag =
        document.getElementById("dragItem");

    const drop =
        document.getElementById("dropZone");


    drag.addEventListener(
        "dragstart",
        e => {

            e.dataTransfer.setData(
                "text",
                q.drag
            );

        }
    );


    drop.addEventListener(
        "dragover",
        e => e.preventDefault()
    );


    drop.addEventListener(
        "drop",
        e => {

            e.preventDefault();

            const value =
                e.dataTransfer.getData("text");


            if (value === q.answer) {

                drop.textContent = "🎉";

                correct();

            }

            else {

                drop.textContent = "❌";

                wrong();

            }


            nextQuestion();

        }
    );

}


/* ==========================================================
   MATCH
========================================================== */

function showMatch(q,area) {

    let pairs = [...q.pairs]
        .sort(() => Math.random() - .5);


    const left =
        pairs.map(
            p => p[0]
        );

    const right =
        pairs.map(
            p => p[1]
        )
        .sort(
            () => Math.random() - .5
        );


    area.innerHTML = `

        <div>${q.question}</div>

        <div class="match-grid">

            <div>
                ${left.map(
                    item =>
                    `<div
                        class="match-item"
                        data-value="${item}"
                        onclick="selectMatch(this)"
                    >
                        ${item}
                    </div>`
                ).join("")}
            </div>

            <div>
                ${right.map(
                    item =>
                    `<div
                        class="match-item"
                        data-value="${item}"
                        onclick="selectMatch(this)"
                    >
                        ${item}
                    </div>`
                ).join("")}
            </div>

        </div>
    `;


    selectedMatch = null;

}


function selectMatch(element) {

    if (element.classList.contains("matched"))
        return;


    if (!selectedMatch) {

        selectedMatch = element;

        element.classList.add("selected");

        return;
    }


    const first =
        selectedMatch.dataset.value;

    const second =
        element.dataset.value;


    const pairs =
        currentQuestions[currentIndex].pairs;


    const matched =
        pairs.some(
            p =>
            (p[0] === first && p[1] === second)
            ||
            (p[0] === second && p[1] === first)
        );


    if (matched) {

        selectedMatch.classList.add("matched");

        element.classList.add("matched");

        selectedMatch = null;

        correct();

        setTimeout(
            nextQuestion,
            600
        );

    }

    else {

        selectedMatch.classList.remove("selected");

        selectedMatch = null;

        wrong();

        setTimeout(
            nextQuestion,
            600
        );

    }

}


/* ==========================================================
   CORRECT
========================================================== */

function correct() {

    score += 10;

    correctAnswers++;


    document.getElementById("score")
        .textContent = score;


    const feedback =
        document.getElementById("feedback");


    feedback.textContent =
        "🎉 Hebat! Jawapan betul!";


    feedback.className =
        "feedback correct-text";


    fireworks();

}


/* ==========================================================
   WRONG
========================================================== */

function wrong() {

    const feedback =
        document.getElementById("feedback");


    feedback.textContent =
        "😊 Cuba lagi!";


    feedback.className =
        "feedback wrong-text";

}


/* ==========================================================
   NEXT QUESTION
========================================================== */

function nextQuestion() {

    setTimeout(() => {

        currentIndex++;

        showQuestion();

    },900);

}


/* ==========================================================
   FIREWORK
========================================================== */

function fireworks() {

    const container =
        document.getElementById("fireworks");


    for (
        let i = 0;
        i < 45;
        i++
    ) {

        const spark =
            document.createElement("div");


        spark.className = "spark";


        spark.style.left =
            "50%";


        spark.style.top =
            "45%";


        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            80 +
            Math.random() *
            220;


        spark.style.setProperty(
            "--x",
            Math.cos(angle) *
            distance +
            "px"
        );


        spark.style.setProperty(
            "--y",
            Math.sin(angle) *
            distance +
            "px"
        );


        spark.style.background =
            [
                "#ff5252",
                "#ffca28",
                "#42a5f5",
                "#66bb6a",
                "#ab47bc",
                "#ff7043"
            ]
            [
                Math.floor(
                    Math.random() * 6
                )
            ];


        container.appendChild(spark);


        setTimeout(
            () => spark.remove(),
            1000
        );

    }

}


/* ==========================================================
   FINISH
========================================================== */

function finishGame() {

    clearInterval(timerInterval);


    document.getElementById("gameScreen")
        .classList.add("hidden");


    document.getElementById("resultScreen")
        .classList.remove("hidden");


    const name =
        document.getElementById("studentName")
        .value;


    document.getElementById("resultName")
        .textContent = name;


    document.getElementById("resultScore")
        .textContent =
        "Markah: " + score;


    let stars = 0;


    if (correctAnswers >= 8)
        stars = 3;

    else if (correctAnswers >= 5)
        stars = 2;

    else if (correctAnswers >= 2)
        stars = 1;


    document.getElementById("resultStars")
        .textContent =
        "⭐".repeat(stars) +
        "☆".repeat(3 - stars);

}


/* ==========================================================
   SECURITY / HTML ESCAPE
========================================================== */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>

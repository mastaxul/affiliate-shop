<!DOCTYPE html>
<html>

<head>
<title>Masta Affiliate Shop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🛒 Masta Affiliate Shop</h1>

<p>Pilihan produk TikTok Shop • Shopee • Lazada</p>

<div id="produk"></div>


<script>

fetch("products.json")
.then(response => response.json())
.then(data => {

let paparan = "";

data.forEach(item => {

paparan += `

<div class="produk">

<img src="${item.gambar}" width="200">

<h2>${item.nama}</h2>

<h3>${item.harga}</h3>

<a href="${item.tiktok}">
<button>TikTok</button>
</a>

<a href="${item.shopee}">
<button>Shopee</button>
</a>

<a href="${item.lazada}">
<button>Lazada</button>
</a>

</div>

`;

});


document.getElementById("produk").innerHTML = paparan;

});

</script>


</body>
</html>

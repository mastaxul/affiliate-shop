<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masta Xul Affiliate Shop</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="https://i.ibb.co/SwpWGqrs/IMG-0606.png" class="logo" alt="Logo">

    <h1>Masta Xul Affiliate Shop</h1>

    <p>Produk Pilihan Dengan Harga Terbaik</p>
</header>

<div class="menu">

    <button class="active" onclick="filterProduk('Semua')">Semua</button>

    <button onclick="filterProduk('Viral')">Viral</button>

    <button onclick="filterProduk('Kesihatan')">Kesihatan</button>

    <button onclick="filterProduk('Gadget')">Gadget</button>

    <button onclick="filterProduk('Rumah')">Rumah</button>

</div>

<div class="search-box">

    <input
        type="text"
        id="search"
        placeholder="Cari produk..."
        onkeyup="cariProduk()">

</div>

<div id="produk-list" class="produk-grid">

</div>

    <!-- Pagination -->
<div class="pagination" id="pagination">
  <button onclick="tukarPage(-1)" id="btnPrev">← Previous</button>
  <span id="pageInfo">Halaman 1</span>
  <button onclick="tukarPage(1)" id="btnNext">Next →</button>
</div>

<footer>

© 2026 Masta Xul Affiliate Shop

</footer>

<!-- Butang Google Form Terapung -->
<a href="https://forms.gle/rr3MzmniqZAtEPhm6" class="float-form" target="_blank" rel="noopener" title="Tambah Produk / Hubungi">
  💬
</a>

<!-- Butang Back to Top -->
<button onclick="scrollToTop()" class="back-to-top" id="backToTop" title="Back to Top">↑</button>

<!-- Live Visitor Counter -->
<div class="visitor-counter" id="visitorCounter">
  👀 <span id="visitCount">-</span> Selamat Datang
</div>
    
<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analisis Kulit | MastaXul</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0d0d0d;
      color: #f2f2f2;
      padding: 20px 16px 40px;
      line-height: 1.45;
    }
    .box {
      max-width: 480px;
      margin: 0 auto;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 22px 18px;
    }
    h1 { font-size: 1.25rem; margin-bottom: 6px; }
    .sub { color: #999; font-size: 0.9rem; margin-bottom: 16px; }
    .warn {
      background: #3e2723;
      border: 1px solid #6B4423;
      color: #ffccbc;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 18px;
    }
    label { display: block; font-weight: 600; font-size: 0.88rem; margin: 14px 0 6px; }
    select, textarea, input[type="file"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 1rem;
    }
    textarea { min-height: 70px; resize: vertical; }
    .preview {
      margin-top: 12px;
      max-width: 100%;
      max-height: 240px;
      border-radius: 12px;
      display: none;
      object-fit: contain;
      background: #000;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #e53935;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      min-height: 48px;
    }
    button:disabled { background: #555; cursor: not-allowed; }
    .result {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #222;
      border: 1px solid #333;
      display: none;
    }
    .result h2 { font-size: 1rem; margin-bottom: 10px; color: #81c784; }
    .result p { margin-bottom: 8px; font-size: 0.92rem; }
    .result ul { padding-left: 18px; margin-bottom: 8px; }
    .err { color: #ef9a9a; margin-top: 12px; font-size: 0.9rem; }
    a.back { display: block; text-align: center; margin-top: 16px; color: #999; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔬 Analisis Kulit</h1>
    <p class="sub">Upload gambar — AI analisa visual (Gemini)</p>

    <div class="warn">
      ⚠️ Bukan diagnosis perubatan. Untuk rujukan awal sahaja.
      Jika sakit, bengkak teruk, atau berdarah — jumpa doktor.
      Untuk dewasa. Jangan upload gambar kanak-kanak.
    </div>

    <form id="formKulit">
      <label>Kawasan kulit</label>
      <select id="kawasan" required>
        <option value="muka">Muka</option>
        <option value="tangan">Tangan</option>
        <option value="badan">Badan</option>
        <option value="kemaluan">Kulit kemaluan</option>
      </select>

      <label>Gambar kulit</label>
      <input type="file" id="gambar" accept="image/*" capture="environment" required>
      <img id="preview" class="preview" alt="Preview">

      <label>Nota (optional)</label>
      <textarea id="nota" placeholder="Contoh: gatal 3 hari, selepas berenang..."></textarea>

      <button type="submit" id="btn">Analisis sekarang</button>
    </form>

    <p class="err" id="err"></p>
    <div class="result" id="result"></div>
    <a class="back" href="/tools/">← Kembali ke Tools</a>
  </div>

  <script>
    // ========== ISI URL APPS SCRIPT ANDA DI SINI SAHAJA ==========
    const API_URL = "LETAK_URL_APPS_SCRIPT_EXEC_DISINI";
    // ============================================================

    const fileInput = document.getElementById("gambar");
    const preview = document.getElementById("preview");
    const form = document.getElementById("formKulit");
    const btn = document.getElementById("btn");
    const err = document.getElementById("err");
    const result = document.getElementById("result");

    fileInput.addEventListener("change", () => {
      const f = fileInput.files[0];
      if (!f) return;
      preview.src = URL.createObjectURL(f);
      preview.style.display = "block";
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      result.style.display = "none";

      if (!API_URL || API_URL.includes("LETAK_URL")) {
        err.textContent = "Sila isi API_URL Apps Script dalam index.html";
        return;
      }

      const file = fileInput.files[0];
      if (!file) {
        err.textContent = "Sila pilih gambar";
        return;
      }

      // Had saiz ~4MB untuk elak timeout
      if (file.size > 4 * 1024 * 1024) {
        err.textContent = "Gambar terlalu besar. Maksimum ~4MB.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Menganalisis...";

      try {
        const dataUrl = await fileToBase64(file);
        const payload = {
          kawasan: document.getElementById("kawasan").value,
          nota: document.getElementById("nota").value.trim(),
          imageBase64: dataUrl,
          mimeType: file.type || "image/jpeg"
        };

        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!data.ok) {
          err.textContent = data.message || "Gagal";
        } else {
          const r = data.result || {};
          const penemuan = (r.penemuan || []).map(x => `<li>${x}</li>`).join("");
          const cadangan = (r.cadangan || []).map(x => `<li>${x}</li>`).join("");
          result.innerHTML = `
            <h2>Hasil analisis</h2>
            <p><strong>Ringkasan:</strong> ${r.ringkasan || "-"}</p>
            <p><strong>Warna:</strong> ${r.warna || "-"}</p>
            <p><strong>Keterukan:</strong> ${r.keterukan || "-"}</p>
            <p><strong>Penemuan:</strong></p>
            <ul>${penemuan || "<li>-</li>"}</ul>
            <p><strong>Cadangan:</strong></p>
            <ul>${cadangan || "<li>-</li>"}</ul>
            <p style="color:#999;font-size:0.8rem;margin-top:10px;">${r.disclaimer || ""}</p>
          `;
          result.style.display = "block";
        }
      } catch (ex) {
        err.textContent = "Ralat rangkaian. Semak API / deploy Apps Script.";
        console.error(ex);
      }

      btn.disabled = false;
      btn.textContent = "Analisis sekarang";
    });
  </script>
</body>
</html>
